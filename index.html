<script>
  let masterPool = [], currentQuestions = [], currentIndex = 0, correctCount = 0, combo = 0;
  let totalCorrectInSession = 0, totalQuestionsInSession = 0;
  let activeView = 'main', currentLabel = '', selectedData = null;
  let quizMode = 'jp-id', quizDifficulty = 'easy', currentAnswer = "", wrongList = [], isMuted = false;
  let startTime, timerInterval, isTimerRunning = false;
  let currentUserID = localStorage.getItem("kuis_rama_userid") || "";
  let fcIndex = 0;

  let globalWrongPool = []; 
  let redemptionUsedInThisSession = false; 

  let isDragging = false;
  let startX, startY;

  function onPointerDown(e) {
    isDragging = false;
    startX = e.clientX;
    startY = e.clientY;
    document.onpointermove = onPointerMove;
    document.onpointerup = onPointerUp;
  }

  function onPointerMove(e) {
    if (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5) {
        isDragging = true;
    }
    const fab = document.getElementById('floatingKamus');
    fab.style.left = (e.clientX - 25) + 'px';
    fab.style.top = (e.clientY - 25) + 'px';
    fab.style.right = 'auto';
  }

  function onPointerUp(e) {
    document.onpointermove = null;
    document.onpointerup = null;
    
    if (!isDragging) {
        openKamusOverlay();
    } else {
        const fab = document.getElementById('floatingKamus');
        const screenWidth = window.innerWidth;
        if (e.clientX < screenWidth / 2) {
            fab.style.left = '0px';
            fab.style.right = 'auto';
        } else {
            fab.style.left = 'auto';
            fab.style.right = '0px';
        }
    }
  }

  function openKamusOverlay() {
    document.getElementById('kamusOverlay').style.display = 'flex';
    document.getElementById('kamusInput').focus();
  }

  function closeKamusOverlay() {
    document.getElementById('kamusOverlay').style.display = 'none';
  }

  function searchGlobal() {
    const query = document.getElementById('kamusInput').value.toLowerCase().trim();
    const resultBox = document.getElementById('kamusResults');
    resultBox.innerHTML = "";
    if (query.length < 2) return;

    let allData = [];
    if(typeof babData !== 'undefined') Object.values(babData).forEach(arr => allData = allData.concat(arr));
    if(typeof referensiData !== 'undefined') Object.values(referensiData).forEach(arr => allData = allData.concat(arr));
    if(typeof irodoriKanjiData !== 'undefined') allData = allData.concat(irodoriKanjiData);
    if(typeof sswPMData !== 'undefined') Object.values(sswPMData).forEach(arr => allData = allData.concat(arr));

    const matches = allData.filter(item => 
      (item.kana && item.kana.toLowerCase().includes(query)) || 
      (item.kanji && item.kanji.toLowerCase().includes(query)) || 
      (item.correct && item.correct.toLowerCase().includes(query))
    );

    matches.slice(0, 30).forEach(m => {
        let div = document.createElement('div');
        div.className = 'search-item';
        div.innerHTML = `<strong>${m.kanji || ''} (${m.kana})</strong><br><span style="color:var(--gold)">➜ ${m.correct}</span>`;
        resultBox.appendChild(div);
    });
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.opacity = '1'; }, 10);
    setTimeout(() => {
      t.style.opacity = '0';
      setTimeout(() => { t.style.display = 'none'; }, 400);
    }, 2500);
  }

  function checkLogin() {
    hideAll();
    if (currentUserID) {
        document.getElementById('userLabel').innerText = "Halo, " + currentUserID + "!";
        showMainMenu();
    } else {
        document.getElementById('loginPage').style.display = 'flex';
        document.getElementById('backBtn').style.display = 'none';
    }
  }

  function handleLogin() {
    const val = document.getElementById('loginInput').value.trim();
    if (val) {
        currentUserID = val;
        localStorage.setItem("kuis_rama_userid", val);
        checkLogin();
    } else {
        showToast("Masukan ID");
    }
  }

  function logout() { document.getElementById('logoutModal').style.display = 'flex'; }
  function closeLogoutModal() { document.getElementById('logoutModal').style.display = 'none'; }
  function confirmLogout() { localStorage.removeItem("kuis_rama_userid"); currentUserID = ""; location.reload(); }

  function saveToCloud(label, score) {
    if(!currentUserID) return;
    const cleanLabel = label.replace(/\s/g, "_");
    database.ref(`users/${currentUserID}/scores/${cleanLabel}`).set(score);
  }

  function saveCurrentState() {
    if(!currentUserID || activeView !== 'quiz') return;
    database.ref(`sessions/${currentUserID}`).set({
      masterPool: masterPool,
      currentQuestions: currentQuestions,
      currentIndex: currentIndex,
      correctCount: correctCount,
      combo: combo,
      totalCorrectInSession: totalCorrectInSession,
      totalQuestionsInSession: totalQuestionsInSession,
      currentLabel: currentLabel,
      quizMode: quizMode,
      quizDifficulty: quizDifficulty,
      activeView: activeView,
      startTime: startTime || 0,
      selectedData: selectedData,
      globalWrongPool: globalWrongPool
    });
  }

  function checkExistingSession() {
    if(!currentUserID) return;
    database.ref(`sessions/${currentUserID}`).once('value', snap => {
      if(snap.exists()) document.getElementById('resumeWrapper').style.display = 'flex';
      else document.getElementById('resumeWrapper').style.display = 'none';
    });
  }

  function resumeQuiz() {
    database.ref(`sessions/${currentUserID}`).once('value', snap => {
      const data = snap.val();
      if(data) {
        masterPool = data.masterPool || [];
        currentQuestions = data.currentQuestions || [];
        currentIndex = data.currentIndex || 0;
        correctCount = data.correctCount || 0;
        combo = data.combo || 0;
        totalCorrectInSession = data.totalCorrectInSession || 0;
        totalQuestionsInSession = data.totalQuestionsInSession || 0;
        currentLabel = data.currentLabel;
        quizMode = data.quizMode;
        quizDifficulty = data.quizDifficulty;
        selectedData = data.selectedData;
        globalWrongPool = data.globalWrongPool || [];
        if(data.startTime > 0) {
           startTime = data.startTime;
           isTimerRunning = true;
           timerInterval = setInterval(updateTimerUI, 100);
        }
        activeView = 'quiz';
        document.getElementById('backBtn').style.display = 'block';
        renderQuestion();
      }
    });
  }

  function clearSession() {
    if(!currentUserID) return;
    database.ref(`sessions/${currentUserID}`).remove();
    document.getElementById('resumeWrapper').style.display = 'none';
    showToast("Sesi dihapus");
  }

  function saveRaceTime(category, time, scorePercent) {
    if(!currentUserID) return;
    const path = `leaderboard/${category}/${currentUserID}`;
    let weight = 1; 
    if(quizDifficulty === 'medium') weight = 2;
    if(quizDifficulty === 'hard') weight = 3;

    database.ref(path).once('value', snap => {
      const data = snap.val();
      if(!data || weight > (data.weight || 0) || 
         (weight === data.weight && scorePercent > (data.score || 0)) || 
         (weight === data.weight && scorePercent === data.score && time < data.time)) {
        database.ref(path).set({
          score: scorePercent,
          time: time,
          weight: weight,
          difficulty: quizDifficulty.toUpperCase(),
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });
        showToast("Rekor Leaderboard diperbarui!");
      }
    });
  }

  function loadLeaderboard(category, elementId) {
    const lbBox = document.getElementById(elementId);
    database.ref(`leaderboard/${category}`).on('value', snap => {
      if(!snap.exists()) { lbBox.style.display = 'none'; return; }
      let players = [];
      snap.forEach(child => { players.push({ name: child.key, ...child.val() }); });
      
      players.sort((a, b) => {
          if (b.weight !== a.weight) return b.weight - a.weight;
          if (b.score !== a.score) return b.score - a.score;
          return a.time - b.time;
      });

      lbBox.innerHTML = `<b style="color:var(--secondary)">RANKING IRODORI (WEIGHTED)</b>`;
      lbBox.style.display = 'block';
      players.slice(0, 10).forEach((p, index) => {
        let div = document.createElement('div');
        div.className = 'lb-item';
        let diffLabel = p.weight === 3 ? "[SULIT]" : (p.weight === 2 ? "[SDG]" : "[MDH]");
        div.innerHTML = `<span>${index + 1}. <small style="color:var(--gold)">${diffLabel}</small> ${p.name} <small style="color:#888">(${p.score || 0}%)</small></span><span>${formatTime(p.time)}</span>`;
        lbBox.appendChild(div);
      });
    });
  }

  function syncStars() {
    if(!currentUserID) return;
    database.ref(`users/${currentUserID}/scores`).on('value', snap => {
      const cloudData = snap.val() || {};
      document.querySelectorAll('.babBtn').forEach(btn => {
        const key = btn.dataset.fullLabel.replace(/\s/g, "_");
        const textOnly = btn.innerText.replace(" ✅", "");
        if(cloudData[key] === 100) btn.innerText = textOnly + " ✅";
        else btn.innerText = textOnly;
      });
    });
  }

  function hideAll() {
    ['loginPage','mainMenu','minnaMenu','irodoriMenu','sswMenu','dynamicMenu','modeMenu','diffMenu','wordBox','options','comboSection','resultPage','inputContainer','progressContainer','logoutModal','flashcardSection']
    .forEach(id => { const el = document.getElementById(id); if(el) el.style.display = 'none'; });
    if (activeView !== 'main') document.getElementById('resumeWrapper').style.display = 'none';
  }

  function toggleMute() {
    isMuted = !isMuted;
    document.getElementById('muteBtn').innerText = isMuted ? '🔇' : '🔊';
    if(isMuted) window.speechSynthesis.cancel();
  }

  function showMainMenu() { hideAll(); document.getElementById('mainMenu').style.display = 'flex'; document.getElementById('backBtn').style.display = 'none'; activeView = 'main'; stopTimer(); checkExistingSession(); }
  function showMinnaMenu() { hideAll(); document.getElementById('minnaMenu').style.display = 'flex'; document.getElementById('backBtn').style.display = 'block'; activeView = 'minna'; }
  function showIrodoriMenu() { hideAll(); document.getElementById('irodoriMenu').style.display = 'flex'; document.getElementById('backBtn').style.display = 'block'; activeView = 'irodori'; loadLeaderboard('irodori', 'leaderboardBox'); }
  function showSSWMenu() { hideAll(); document.getElementById('sswMenu').style.display = 'flex'; document.getElementById('backBtn').style.display = 'block'; activeView = 'ssw'; }
  function showSSWGrid() { showGridMenu("SSW PM", "ssw_pm", 2, 65); }

  function showGridMenu(title, type, start, end) {
    hideAll();
    const grid = document.getElementById('headerGrid');
    document.getElementById('dynamicTitle').innerText = title;
    grid.innerHTML = '';
    document.getElementById('dynamicMenu').style.display = 'flex';
    document.getElementById('backBtn').style.display = 'block';
    activeView = type;
    for(let i=start; i<=end; i++) {
        let currentTargetData = null;
        let prefix = "Bab ";
        if (type === 'ssw_pm') {
            if (i === 4 || i === 23 || i === 59) continue;
            if (typeof sswPMData !== 'undefined' && sswPMData[i]) currentTargetData = sswPMData[i];
            prefix = "SSW Page ";
        } else if (type === 'ref') {
            if (typeof referensiData !== 'undefined' && referensiData[i]) currentTargetData = referensiData[i];
            prefix = "Ref Bab ";
        } else {
            if (typeof babData !== 'undefined' && babData[i]) currentTargetData = babData[i];
        }
        if (!currentTargetData) continue;
        let b = document.createElement('button');
        b.className = 'babBtn';
        const labelText = (type === 'ssw_pm') ? 'Page ' + i : 'Bab ' + i;
        b.innerText = labelText;
        b.dataset.fullLabel = prefix + i;
        b.onclick = () => { selectedData = currentTargetData; currentLabel = prefix + i; showModeMenu(); };
        grid.appendChild(b);
    }
    syncStars(); 
  }

  function showBagian(n) { showGridMenu("Minna No Nihongo", 'bagian_'+n, n === 1 ? 1 : 25, n === 1 ? 25 : 50); }
  function showRefMenu() { showGridMenu("Kosakata Referensi", "ref", 1, 50); }
  function startIrodoriKanji() { selectedData = (typeof irodoriKanjiData !== 'undefined') ? irodoriKanjiData : []; currentLabel = "Irodori"; showModeMenu(); }
  function showModeMenu() { hideAll(); document.getElementById('modeMenu').style.display = 'flex'; document.getElementById('modeInfo').innerText = currentLabel; activeView = 'mode'; document.getElementById('backBtn').style.display = 'block'; }
  function setQuizDirection(mode) { quizMode = mode; hideAll(); document.getElementById('diffMenu').style.display = 'flex'; activeView = 'difficulty'; }
  function setDifficulty(level) { quizDifficulty = level; startQuiz(currentLabel, selectedData); }

  function startFlashcardMode() {
    hideAll();
    activeView = 'flashcard';
    document.getElementById('flashcardSection').style.display = 'flex';
    document.getElementById('backBtn').style.display = 'block';
    fcIndex = 0;
    renderFlashcard();
  }

  function renderFlashcard() {
    const q = selectedData[fcIndex];
    const inner = document.getElementById('cardInner');
    inner.classList.remove('is-flipped');
    document.getElementById('fcInfo').innerText = `${currentLabel}\nKartu ${fcIndex + 1} / ${selectedData.length}`;
    
    if (currentLabel.includes("Irodori")) {
        const isAlfabet = /^[A-Za-z\s.,!?]+$/.test(q.kanji);
        if (isAlfabet) {
            document.getElementById('fcFront').innerText = q.correct; 
            document.getElementById('fcBackRead').innerText = `${q.kana}`;
            document.getElementById('fcBackMean').innerText = q.kanji;
        } else {
            document.getElementById('fcFront').innerHTML = (q.kanji && q.kanji.trim() !== "") ? q.kanji : q.kana;
            document.getElementById('fcBackRead').innerText = `${q.kana}`;
            document.getElementById('fcBackMean').innerText = q.correct;
        }
    } else {
        document.getElementById('fcFront').innerHTML = (q.kanji && q.kanji.trim() !== "") ? `<ruby>${q.kanji}<rt>${q.kana}</rt></ruby>` : q.kana;
        document.getElementById('fcBackRead').innerText = "";
        document.getElementById('fcBackMean').innerText = q.correct;
    }
  }

  function flipCard() { document.getElementById('cardInner').classList.toggle('is-flipped'); }
  function nextCard() { if(fcIndex < selectedData.length - 1) { fcIndex++; renderFlashcard(); } else { showToast("Selesai!"); } }
  function prevCard() { if(fcIndex > 0) { fcIndex--; renderFlashcard(); } }
  function playAudioFC() { if(isMuted) return; const q = selectedData[fcIndex]; window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(q.kana); u.lang = 'ja-JP'; window.speechSynthesis.speak(u); }

  function startQuiz(label, data) {
    if(!data || data.length === 0) { alert("Data kosong!"); return; }
    currentLabel = label;
    masterPool = [...data].sort(() => Math.random() - 0.5);
    totalCorrectInSession = 0;
    totalQuestionsInSession = data.length;
    globalWrongPool = []; 
    redemptionUsedInThisSession = false;
    
    if(label.includes("Irodori")) { 
      startTime = Date.now(); 
      isTimerRunning = true; 
      timerInterval = setInterval(updateTimerUI, 100); 
    } else { 
      stopTimer(); 
      document.getElementById('timerDisplay').innerText = ""; 
    }
    nextChunk();
  }

  function stopTimer() { clearInterval(timerInterval); isTimerRunning = false; }
  function updateTimerUI() { if(!isTimerRunning) return; const diff = Date.now() - startTime; document.getElementById('timerDisplay').innerText = "⌛ " + formatTime(diff); }
  
  function nextChunk() { 
    redemptionUsedInThisSession = false; 
    currentQuestions = masterPool.splice(0, 10); 
    currentIndex = 0; 
    correctCount = 0; 
    combo = 0; 
    wrongList = []; 
    activeView = 'quiz'; 
    document.getElementById('backBtn').style.display = 'block'; 
    renderQuestion(); 
  }

  function formatTime(ms) { let s = Math.floor(ms / 1000); let m = Math.floor(s / 60); s = s % 60; return `${m}:${s < 10 ? '0'+s : s}`; }

  function updateProgressBar() {
    const container = document.getElementById('progressContainer');
    container.style.display = 'flex';
    container.innerHTML = '';
    for (let i = 0; i < currentQuestions.length; i++) {
        let segment = document.createElement('div');
        segment.className = 'progress-segment';
        if (i < currentIndex) segment.classList.add('active');
        container.appendChild(segment);
    }
  }

  function renderQuestion() {
    if(currentIndex >= currentQuestions.length) { showResult(); return; }
    hideAll();
    updateProgressBar();
    saveCurrentState();
    const q = currentQuestions[currentIndex];
    const display = document.getElementById('displayWord');
    const inputField = document.getElementById('userAnswer');
    inputField.classList.remove('correct-flash', 'wrong-flash');
    inputField.style.borderColor = "#333";
    document.getElementById('wordBox').style.display = 'flex';
    document.getElementById('comboSection').style.display = 'block';
    document.getElementById('quizInfo').innerText = `${currentLabel} | ${quizDifficulty.toUpperCase()}`;
    document.getElementById('instruksi').innerText = (quizDifficulty === 'hard') ? "Ketik jawabannya" : "Pilih jawaban benar";
    document.getElementById('userAnswer').value = "";
    document.getElementById('wrongMsg').style.display = "none";
    document.getElementById('backBtn').style.display = 'block';

    const isIrodoriEasy = currentLabel.includes("Irodori") && quizDifficulty === 'easy';

    if (quizMode === 'jp-id') {
        document.getElementById('mainSpeaker').style.display = 'flex';
        if (isIrodoriEasy) {
            display.innerText = (q.kanji && q.kanji.trim() !== "") ? q.kanji : q.kana;
            currentAnswer = q.kana;
            let choices = [q.kana];
            let pData = selectedData || [];
            let others = pData.filter(item => item.kana !== q.kana).map(o => o.kana);
            choices = choices.concat(others.sort(() => 0.5 - Math.random()).slice(0, 3));
            setupLayout(choices);
        } else {
          if (currentLabel.includes("Irodori") && quizDifficulty === 'medium') {
            display.innerText = (q.kanji && q.kanji.trim() !== "") ? q.kanji : q.kana;
        } else
            if (quizDifficulty === 'easy') display.innerText = q.kana;
            else display.innerHTML = (q.kanji && q.kanji.trim() !== "") ? `<ruby>${q.kanji}<rt>${q.kana}</rt></ruby>` : q.kana;
            currentAnswer = q.correct;
            let choices = (q.answers && q.answers.length >= 4) ? [...q.answers] : [q.correct];
            if (choices.length < 4) {
                let pData = selectedData || [];
                let pool = pData.filter(item => item.correct !== q.correct).map(item => item.correct);
                choices = choices.concat(pool.sort(() => 0.5 - Math.random()).slice(0, 4 - choices.length));
            }
            setupLayout(choices);
        }
        setTimeout(playAudio, 300);
    } else {
        document.getElementById('mainSpeaker').style.display = 'none';
        if (isIrodoriEasy) {
            display.innerHTML = `<div style="font-size:16px; color:var(--primary); margin-bottom:5px;">Pilih Kanji Yang Tepat:</div>${q.correct}<br><div style="font-size:24px; color:#666; margin-top:10px;">(${q.kana})</div>`;
            currentAnswer = (q.kanji && q.kanji.trim() !== "") ? q.kanji : q.kana;
            let choices = [currentAnswer];
            let pData = selectedData || [];
            let others = pData.filter(item => item.kanji !== q.kanji).map(o => (o.kanji || o.kana));
            choices = choices.concat(others.sort(() => 0.5 - Math.random()).slice(0, 3));
            setupLayout(choices);
        } else {
            display.innerHTML = `<div style="font-size:16px; color:var(--primary); margin-bottom:5px;">Terjemahkan:</div>${q.correct}`;
            currentAnswer = (quizDifficulty === 'easy') ? q.kana : (q.kanji && q.kanji.trim() !== "" ? q.kanji : q.kana);
            let choices = [currentAnswer];
            let pData = selectedData || [];
            let others = pData.filter(item => item.kana !== q.kana).map(o => (quizDifficulty === 'easy') ? o.kana : (o.kanji || o.kana));
            choices = choices.concat(others.sort(() => 0.5 - Math.random()).slice(0, 3));
            setupLayout(choices);
        }
    }
    document.getElementById('flowerCount').innerText = combo;
  }

  function setupLayout(choices) {
    const optBox = document.getElementById('options');
    if(quizDifficulty === 'hard') {
        document.getElementById('inputContainer').style.display = 'flex';
        document.getElementById('userAnswer').focus();
    } else {
        optBox.style.display = 'flex';
        optBox.innerHTML = '';
        let finalChoices = [...new Set(choices)].slice(0, 4);
        if(finalChoices.length < 4) {
             let pData = selectedData || [];
             let backup = pData.map(item => (quizMode === 'jp-id' ? item.correct : (item.kanji || item.kana)));
             for(let item of backup) { if(!finalChoices.includes(item)) finalChoices.push(item); if(finalChoices.length === 4) break; }
        }
        finalChoices.sort(()=>Math.random()-0.5).forEach(txt => {
            let b = document.createElement('button');
            b.className = 'optBtn'; b.innerText = txt;
            b.onclick = () => processAnswer(txt === currentAnswer, b);
            optBox.appendChild(b);
        });
    }
  }

  function playAudio() {
    if (isMuted) return;
    const q = currentQuestions[currentIndex];
    if (!q) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(q.kana || q.kanji);
    utterance.lang = 'ja-JP';
    utterance.rate = 0.8;
    window.speechSynthesis.speak(utterance);
  }

  function clean(t) { return t ? t.replace(/\(.*\)|\[.*\]|[~〜\-\s]/g, "").toLowerCase().trim() : ""; }

  function checkInputAnswer() {
    const q = currentQuestions[currentIndex];
    const inputField = document.getElementById('userAnswer');
    const msg = document.getElementById('wrongMsg');
    const cleanUser = clean(inputField.value.trim());
    let isCorrect = (quizMode === 'jp-id') ? q.correct.split(/,| atau /).some(opt => clean(opt) === cleanUser) : (cleanUser === clean(q.kanji) || cleanUser === clean(q.kana));
    if(isCorrect) { inputField.classList.add('correct-flash'); processAnswer(true); } 
    else { inputField.classList.add('wrong-flash'); inputField.classList.add('shake'); msg.style.display = 'block'; msg.innerText = (quizMode === 'jp-id') ? `Jawabannya: ${q.correct}` : `Jwb: ${q.kanji || ''} (${q.kana})`; setTimeout(() => { inputField.classList.remove('shake'); processAnswer(false); }, 1500); }
  }

  function processAnswer(isCorrect, btn = null) {
    const q = currentQuestions[currentIndex];
    if(isCorrect) { 
        if(btn) btn.classList.add('correct'); 
        correctCount++; 
        combo++; 
        totalCorrectInSession++; 
        if(quizMode === 'id-jp') playAudio(); 
    } else { 
        if(btn) btn.classList.add('wrong'); 
        const exists = globalWrongPool.some(item => item.kana === q.kana && item.correct === q.correct);
        if (!exists) globalWrongPool.push(q);
        wrongList.push(q); 
        combo = 0; 
        if(btn) Array.from(document.getElementById('options').children).forEach(b => { if(b.innerText === currentAnswer) b.classList.add('correct'); }); 
    }
    setTimeout(() => { currentIndex++; renderQuestion(); }, (isCorrect ? 600 : 1600));
  }

  function showResult() {
    const isIrodori = currentLabel.includes("Irodori");
    // Sesi dianggap benar-benar beres jika masterPool kosong DAN (soal salah habis ATAU jatah tebus sudah dipakai)
    const isFinished = (masterPool.length === 0 && (globalWrongPool.length === 0 || redemptionUsedInThisSession));
    document.getElementById('nextBabBtn').style.display = 'none';
    
    if(isIrodori && isFinished) stopTimer();
    hideAll();
    activeView = 'result';
    document.getElementById('resultPage').style.display = 'flex';
    document.getElementById('backBtn').style.display = 'block';
    
    let p = Math.round((correctCount / currentQuestions.length) * 100);
    if (p > 100) p = 100;
    document.getElementById('finalScore').innerText = p + "%";
    
    let totalAccuracy = totalQuestionsInSession > 0 ? Math.round((totalCorrectInSession / totalQuestionsInSession) * 100) : 0;
    if (totalAccuracy > 100) totalAccuracy = 100;

    document.getElementById('finalDetail').innerText = `Pending Redemption: ${globalWrongPool.length} | Sisa Soal: ${masterPool.length}\nAkurasi: ${totalAccuracy}%`;
    
    if(isIrodori && isFinished) {
        const finalDiff = Date.now() - startTime;
        document.getElementById('timerResult').innerText = "TOTAL WAKTU: " + formatTime(finalDiff);
        saveRaceTime("irodori", finalDiff, totalAccuracy);
    }

    if(isFinished && totalAccuracy >= 100) {
        saveToCloud(currentLabel, 100);
        showToast("Bab Tuntas 100%!");
    }

    // Hapus sesi di Firebase jika sudah tidak ada aktivitas yang bisa dilakukan
    if(isFinished) {
        clearSession(); 
    } else {
        saveCurrentState();
    }

    const rb = document.getElementById('reviewBox');
    rb.innerHTML = '';
    
    let redeemDiv = document.createElement('div');
    redeemDiv.style.cssText = "margin:10px 0; padding:15px; background:#252525; border-radius:12px; border:1px dashed var(--gold);";
    
    if (globalWrongPool.length > 0) {
        if (!redemptionUsedInThisSession) {
            redeemDiv.innerHTML = `<p style="color:var(--gold); margin-top:0;">Tersedia Poin Redemption: ${globalWrongPool.length} </p>`;
            let btnR = document.createElement('button');
            btnR.className = "mainBtn goldBtn";
            btnR.style.fontSize = "13px";
            btnR.innerText = "🎲 TEBUS SOAL";
            btnR.onclick = startSingleRedemption;
            redeemDiv.appendChild(btnR);
        } else {
            redeemDiv.innerHTML = `<p style="color:#ff4444; font-size:12px; margin:0; font-weight:bold;">Kesempatan Redemption Habis!</p>
                                   <p style="color:#888; font-size:11px; margin-top:5px;">Selesaikan sisa kuis atau ulang dari awal untuk membersihkan sisa soal salah.</p>`;
        }
    } else {
        redeemDiv.innerHTML = `<p style="color:#4caf50; margin:0;">Redemption Selesai</p>`;
    }
    rb.appendChild(redeemDiv);

    const btnLanjut = document.getElementById('nextChunkBtn');
    if (masterPool.length > 0) { 
        btnLanjut.style.display = 'block'; 
        btnLanjut.innerText = "LANJUT KUIS";
        btnLanjut.onclick = nextChunk; 
    } else { 
        btnLanjut.style.display = 'none';
      database.ref(`users/${currentUserID}/redemptionPool`).remove();
      
      if (isFinished) {
            setupNextBabButton();
            }
    }
  }

  function startSingleRedemption() {
  if (globalWrongPool.length === 0 || redemptionUsedInThisSession) return;
  const randomIndex = Math.floor(Math.random() * globalWrongPool.length);
  const target = globalWrongPool[randomIndex];
  globalWrongPool.splice(randomIndex, 1);
  currentQuestions = [target];
  currentIndex = 0;
  redemptionUsedInThisSession = true;
  
  saveCurrentState(); // Update status di Firebase bahwa redem sudah terpakai
  showToast("Menebus 1 soal acak...");
  renderQuestion();
}

  function setupNextBabButton() {
    let currentNum = parseInt(currentLabel.replace(/[^0-9]/g, ''));
    if (isNaN(currentNum)) return; // Jika tidak ada angka (seperti Irodori Full Kanji), batalkan.

    let nextNum = currentNum + 1;
    let nextTargetData = null;
    let nextLabelText = "";

    // Deteksi tipe materi berdasarkan teks di currentLabel
    if (currentLabel.includes("SSW Page")) {
        // Kasus khusus skip page kosong sesuai logika grid kamu (4, 23, 59)
        if (nextNum === 4) nextNum = 5;
        if (nextNum === 23) nextNum = 24;
        if (nextNum === 59) nextNum = 60;

        if (typeof sswPMData !== 'undefined' && sswPMData[nextNum]) {
            nextTargetData = sswPMData[nextNum];
            nextLabelText = "SSW Page " + nextNum;
        }
    } else if (currentLabel.includes("Ref Bab")) {
        if (typeof referensiData !== 'undefined' && referensiData[nextNum]) {
            nextTargetData = referensiData[nextNum];
            nextLabelText = "Ref Bab " + nextNum;
        }
    } else if (currentLabel.includes("Bab")) {
        if (typeof babData !== 'undefined' && babData[nextNum]) {
            nextTargetData = babData[nextNum];
            nextLabelText = "Bab " + nextNum;
        }
    }

    // Jika data bab berikutnya ditemukan, munculkan tombolnya
    if (nextTargetData) {
        const nextBtn = document.getElementById('nextBabBtn');
        nextBtn.style.display = 'block';
        nextBtn.innerText = "⏩ LANJUT " + nextLabelText.toUpperCase();
        
        // Atur agar ketika diklik, data langsung berganti dan kuis langsung dimulai
        nextBtn.onclick = function() {
            selectedData = nextTargetData;
            currentLabel = nextLabelText;
            
            // Langsung mulai kuis dengan mode & kesulitan yang sedang aktif saat ini
            startQuiz(currentLabel, selectedData);
        };
    }
  }
  
  function goBack() {
    window.speechSynthesis.cancel();
    stopTimer();
    if (activeView === 'flashcard' || activeView === 'quiz' || activeView === 'result' || activeView === 'difficulty') showModeMenu();
    else if (activeView === 'mode') {
        if(currentLabel.includes("Ref")) showRefMenu();
        else if(currentLabel.includes("Irodori")) showIrodoriMenu();
        else if(currentLabel.includes("SSW")) showSSWGrid();
        else showBagian(parseInt(currentLabel.replace("Bab ","")) <= 25 ? 1 : 2);
    } 
    else if (activeView.startsWith('bagian') || activeView === 'ref') showMinnaMenu();
    else if (activeView === 'ssw_pm') showSSWMenu();
    else if (activeView === 'ssw' || activeView === 'irodori' || activeView === 'minna') showMainMenu();
    else showMainMenu();
  }

  document.getElementById('userAnswer').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkInputAnswer(); });
  window.onload = checkLogin;
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<style>
  #bukuOverlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; z-index: 10001; display: none; flex-direction: column;
  }
  #bukuCanvasContainer {
    flex-grow: 1; display: flex; justify-content: center; align-items: center;
    overflow: hidden; background: #333; position: relative;
  }
  #pdfCanvas { max-width: 100%; max-height: 90vh; box-shadow: 0 0 20px rgba(0,0,0,0.5); border: 5px solid white; }
  .buku-nav {
    display: flex; justify-content: space-between; padding: 20px;
    background: #1e1e1e; border-top: 1px solid #333;
  }
  #pageFlipSound { display: none; }
</style>

<div id="bukuOverlay">
    <div style="padding: 15px; display: flex; justify-content: space-between; align-items: center; background: var(--card);">
        <span id="bukuTitle" style="font-weight: bold; color: var(--primary);">MATERI</span>
        <button onclick="tutupBuku()" style="background:none; border:none; color:white; font-size:24px;">✕</button>
    </div>
    <div id="bukuCanvasContainer">
        <canvas id="pdfCanvas"></canvas>
    </div>
    <div class="buku-nav">
        <button class="fc-btn" onclick="prevHalaman()">  ⬅  </button>
        <span id="pageNumDisplay" style="align-self: center; color: var(--gold);">Hal: 1 / --</span>
        <button class="fc-btn" onclick="nextHalaman()">  ➡  </button>
    </div>
</div>

<audio id="pageFlipSound" src="https://www.soundjay.com/misc/sounds/page-flip-01a.mp3"></audio>

<script>
  const URL_PDF_KAMU = 'materi.pdf';
  let pdfDoc = null, pageNum = 1, isRendering = false;
  const canvas = document.getElementById('pdfCanvas'), ctx = canvas.getContext('2d');

  window.addEventListener('DOMContentLoaded', () => {
    const mainMenu = document.getElementById('mainMenu');
    const btnBuku = document.createElement('button');
    btnBuku.className = 'mainBtn goldBtn';
    btnBuku.style.marginTop = '10px';
    btnBuku.innerHTML = '📖 MATERI 文法';
    btnBuku.onclick = bukaBuku;
    mainMenu.insertBefore(btnBuku, mainMenu.lastElementChild.previousElementSibling);
  });

  function bukaBuku() {
    document.getElementById('bukuOverlay').style.display = 'flex';
    if (!pdfDoc) {
        pdfjsLib.getDocument(URL_PDF_KAMU).promise.then(doc => {
            pdfDoc = doc;
            document.getElementById('pageNumDisplay').innerText = `Hal: ${pageNum} / ${pdfDoc.numPages}`;
            renderHalaman(pageNum);
        }).catch(err => {
            alert("Gagal memuat PDF.");
            tutupBuku();
        });
    }
  }

  function renderHalaman(num) {
    isRendering = true;
    pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale: 1.5 });
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        page.render({ canvasContext: ctx, viewport: viewport }).promise.then(() => {
            isRendering = false;
            document.getElementById('pageNumDisplay').innerText = `Hal: ${num} / ${pdfDoc.numPages}`;
        });
    });
  }

  function playFlip() {
    const sfx = document.getElementById('pageFlipSound');
    sfx.currentTime = 0;
    sfx.play();
  }

  function nextHalaman() {
    if (pageNum >= pdfDoc.numPages || isRendering) return;
    pageNum++;
    playFlip();
    renderHalaman(pageNum);
  }

  function prevHalaman() {
    if (pageNum <= 1 || isRendering) return;
    pageNum--;
    playFlip();
    renderHalaman(pageNum);
  }

  function tutupBuku() {
    document.getElementById('bukuOverlay').style.display = 'none';
  }
</script>
</body>
