<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JFT KILAT - ADMIN PANEL</title>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script src="data_minna.js"></script>

<script>
  let database = null;
  let firebaseAktif = false;
  const firebaseConfig = {
    apiKey: "AIzaSyBZSps-natL_AFexEnQl9-chHFiLO0GXes",
    authDomain: "kuis-jepang-29cf5.firebaseapp.com",
    projectId: "kuis-jepang-29cf5",
    storageBucket: "kuis-jepang-29cf5.firebasestorage.app",
    messagingSenderId: "720051856565",
    appId: "1:720051856565:web:6f068222f5d37dd8210afc",
    measurementId: "G-WJMY1D0Q6F",
    databaseURL: "https://kuis-jepang-29cf5-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
  
  try {
     if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
     database = firebase.database();
     firebaseAktif = true;
  } catch (error) { console.error("Firebase Error:", error); }
</script>

<style>
  :root { --bg: #121212; --card: #1e1e1e; --text: #eee; --primary: #2196f3; --green: #4caf50; --red: #f44336; --gold: #ffb74d; }
  * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
  .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
  .box { background: var(--card); border: 1px solid #333; padding: 20px; border-radius: 15px; }
  
  input[type="text"], input[type="number"], input[type="file"], select { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #444; background: #222; color: white; margin-bottom: 10px; outline: none; }
  
  .btn { background: #ff5722; color: white; border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 #bf360c; display: block; margin-top: 10px; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #bf360c; }
  .greenBtn { background: var(--green); box-shadow: 0 4px 0 #2e7d32; }
  
  .preview-img-box { width: 100%; max-height: 250px; background: #000; border-radius: 8px; margin-bottom: 10px; display: none; justify-content: center; align-items: center; overflow: hidden; border: 1px solid #444; }
  .preview-img-box img { max-width: 100%; max-height: 250px; object-fit: contain; }
  
  .output-box { display: none; background: #151515; border: 2px solid var(--gold); border-radius: 12px; padding: 15px; margin-top: 10px; }
  .url-text { background: #222; padding: 10px; border-radius: 8px; font-size: 13px; color: var(--gold); word-break: break-all; margin-bottom: 10px; font-family: monospace; }
</style>
</head>
<body>

<div class="container">
  <div id="viewAdmin" class="box">
     <h2 style="color: var(--gold); margin-top: 0; text-align: center;">⚡ JFT KILAT ADMIN</h2>
     
     <label style="font-size: 12px; color: #aaa;">Masa Aktif Kuis (Menit):</label>
     <input type="number" id="expiryInput" value="180">

     <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
           <label style="font-size: 12px; color: #aaa;">Pilih Bab Minna:</label>
           <input type="number" id="babInput" value="1" min="1">
        </div>
        <div style="flex: 1;">
           <label style="font-size: 12px; color: #aaa;">Jumlah Soal:</label>
           <input type="number" id="jumlahSoalInput" value="5" min="1">
        </div>
     </div>
     
     <label style="font-size: 12px; color: #aaa;">Upload Gambar Utama Kuis (Wajib):</label>
     <input type="file" accept="image/*" onchange="konversiGambarKeBase64(this)">
     <div class="preview-img-box" id="pvBoxAdmin"></div>
     <input type="text" id="stringBaseAdmin" style="display:none;" value="">
     
     <button class="btn greenBtn" type="button" onclick="simpanDanBikinLink()">🚀 AMBIL DATA BAB & BUAT LINK</button>

     <div class="output-box" id="outputLinkContainer">
        <div style="font-size: 12px; font-weight: bold; margin-bottom: 5px;">🔗 LINK KUIS UNTUK SISWA:</div>
        <div class="url-text" id="textLinkSiswa">Mengecek...</div>
        <button class="btn" style="background:var(--gold); color:#000; box-shadow:0 4px 0 #e65100;" type="button" onclick="salinLinkKuis()">📋 SALIN LINK KUIS</button>
     </div>
  </div>
</div>

<script>
  function konversiGambarKeBase64(fileInput) {
     if (!fileInput.files || !fileInput.files) return;
     const reader = new FileReader();
     reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
           const canvas = document.createElement('canvas');
           let w = img.width; let h = img.height;
           if (w > 500) { h = Math.round((h * 500) / w); w = 500; }
           canvas.width = w; canvas.height = h;
           canvas.getContext('2d').drawImage(img, 0, 0, w, h);
           
           const finalBase64 = canvas.toDataURL('image/jpeg', 0.5);
           document.getElementById('stringBaseAdmin').value = finalBase64;
           
           const pv = document.getElementById('pvBoxAdmin');
           pv.innerHTML = `<img src="${finalBase64}">`;
           pv.style.display = 'flex';
        };
        img.src = e.target.result;
     };
     reader.readAsDataURL(fileInput.files);
  }

  function simpanDanBikinLink() {
     const imgData = document.getElementById('stringBaseAdmin').value;
     const babDipilih = document.getElementById('babInput').value.trim();
     const jumlahDiminta = parseInt(document.getElementById('jumlahSoalInput').value) || 5;

     if(!imgData) { alert("Upload gambar pertanyaannya dulu, bro!"); return; }
     
     // Validasi keberadaan variabel babData dari data_minna.js
     if(typeof babData === 'undefined') { alert("Variabel babData tidak ditemukan! Cek file data_minna.js lu."); return; }
     
     // Mengambil array soal berdasarkan key bab yang diinput
     const listSoalBab = babData[babDipilih];
     if(!listSoalBab || listSoalBab.length === 0) { alert(`Data Minna untuk Bab ${babDipilih} kosong atau tidak ada!`); return; }

     if(!firebaseAktif || !database) { alert("Firebase belum siap!"); return; }

     // Mengacak isi soal khusus dari bab yang dipilih
     let soalAcak = [...listSoalBab].sort(() => 0.5 - Math.random());
     let paketSoalSelected = soalAcak.slice(0, jumlahDiminta);

     // Mapping data agar menyertakan gambar yang diupload admin
     let paketSoalFinal = paketSoalSelected.map(soal => {
        return {
           image: imgData, 
           kanji: soal.kanji || "",
           kana: soal.kana || "",
           answers: soal.answers, 
           correct: soal.correct
        }
     });

     const menit = parseInt(document.getElementById('expiryInput').value) || 180;
     const expired = Date.now() + (menit * 60 * 1000);
     const roomID = "JFT-" + Math.floor(1000 + Math.random() * 9000);

     // Mengarahkan link langsung ke kuis.html
     let linkSiswa = window.location.origin + "/kuis.html?room=" + roomID;

     database.ref("kuis_master_baru/" + roomID).set({
        roomID: roomID, expiredAt: expired, questions: paketSoalFinal
     }, (err) => {
        if(err) { alert("Gagal Simpan ke Firebase: " + err.message); } else {
           document.getElementById('textLinkSiswa').innerText = linkSiswa;
           document.getElementById('outputLinkContainer').style.display = 'block';
           alert(`🚀 LINK BERHASIL DICREATE DARI MINNA BAB ${babDipilih}!`);
        }
     });
  }

  function salinLinkKuis() {
     navigator.clipboard.writeText(document.getElementById('textLinkSiswa').innerText);
     alert("Link disalin!");
  }
</script>
</body>
</html>
