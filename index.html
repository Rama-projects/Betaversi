<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JFT MASTER PANEL - ISOLATED DATABASE</title>

<!-- Firebase App & Database Compat -->
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
  let database = null;
  let firebaseAktif = false;

  // Kode API bawaan Anda tetap dipakai tanpa diubah
  const firebaseConfig = {
    apiKey: "AIzaSyBZSps-natL_AFexEnQl9-chHFiLO0GXes",
    authDomain: "kuis-jepang-29cf5.firebaseapp.com",
    projectId: "kuis-jepang-29cf5",
    storageBucket: "kuis-jepang-29cf5.firebasestorage.app",
    messagingSenderId: "720051856565",
    appId: "1:720051856565:web:6f068222f5d37dd8210afc",
    measurementId: "G-WJMY1D0Q6F",
    databaseURL: "https://kuis-jepang-29cf5-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
  
  try {
     if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
     }
     database = firebase.database();
     firebaseAktif = true;
  } catch (error) {
     console.error("Gagal terhubung ke Firebase:", error);
  }
</script>

<style>
  :root { --primary: #ff5722; --secondary: #2196f3; --bg: #121212; --card: #1e1e1e; --text: #eee; --gold: #ffb74d; --green: #4caf50; --red: #f44336; }
  * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; pointer-events: auto !important; }
  html, body { margin: 0; padding: 0; background-color: var(--bg); color: var(--text); }
  body { display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
  #app { width: 100vw; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
  
  .admin-box { background: var(--card); border: 1px solid #333; padding: 20px; border-radius: 15px; }
  .soal-card-input { background: #252525; border: 1px dashed var(--secondary); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
  
  input[type="text"], input[type="number"] { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #444; background: #222; color: white; font-size: 14px; margin-bottom: 8px; outline: none; }
  
  .mainBtn { position: relative; z-index: 10; background: var(--primary); border-radius: 12px; padding: 14px; font-weight: bold; color: white; width: 100%; border: none; cursor: pointer !important; font-size: 14px; text-transform: uppercase; box-shadow: 0 4px 0 #bf360c; transition: 0.1s; display: block; }
  .mainBtn:active { transform: translateY(2px); box-shadow: 0 2px 0 #bf360c; }
  .secBtn { background: var(--secondary); box-shadow: 0 4px 0 #1565c0; }
  .greenBtn { background: var(--green); box-shadow: 0 4px 0 #2e7d32; }
  .redBtn { background: var(--red); box-shadow: 0 4px 0 #b71c1c; }
  .goldBtn { background: var(--gold); box-shadow: 0 4px 0 #e65100; color: #000; }

  .room-active-item { background: #252525; border: 1px solid #444; border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .report-user-card { background: #1a1a1a; border-radius: 10px; padding: 12px; margin-bottom: 10px; border-left: 4px solid var(--secondary); }
  .badge { padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; color: white; display: inline-block; margin-right: 5px; }
  
  #toast { display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: white; padding: 12px 25px; border-radius: 25px; z-index: 9999; font-size: 13px; text-align: center; border: 1px solid #444; }
  .modal-report { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 99999; justify-content: center; align-items: center; padding: 20px; }
  .modal-content { background: var(--card); border: 1px solid #444; border-radius: 20px; width: 100%; max-width: 450px; padding: 20px; display: flex; flex-direction: column; max-height: 90vh; }
  .status-db { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: bold; display: inline-block; margin-top: 5px; }
</style>
</head>
<body>

<div id="toast"></div>

<div id="app">
  
  <div style="text-align: center; margin-bottom: 5px;">
     <h1 style="color: var(--gold); margin: 0; font-size: 26px;">JFT MASTER PANEL</h1>
     <div id="dbStatusBadge" class="status-db" style="background: rgba(244, 67, 54, 0.2); color: var(--red);">Menghubungkan Ke Firebase...</div>
  </div>

  <!-- BAGIAN INPUT SOAL -->
  <div class="admin-box">
     <h3 style="color: var(--secondary); font-size: 16px; margin-bottom: 15px; margin-top:0;">🆕 BUAT PAKET KUIS BARU</h3>
     
     <label style="font-size: 12px; color: #aaa; display: block; margin-bottom: 5px;">Masa Aktif Link (Menit):</label>
     <input type="number" id="linkExpiryInput" value="30" min="1">
     
     <div id="dynamicSoalWrapper" style="max-height: 250px; overflow-y: auto; margin-top: 10px; padding-right: 5px;"></div>
     
     <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="mainBtn secBtn" onclick="tambahKolomSoalBaru()">➕ TAMBAH SOAL</button>
        <button class="mainBtn greenBtn" onclick="mulaiKuisDanGenerateLinkBaru()">🚀 MULAI & BUAT LINK</button>
     </div>
  </div>

  <!-- BAGIAN DAFTAR KUIS AKTIF -->
  <div class="admin-box">
     <h3 style="color: var(--gold); font-size: 16px; margin-bottom: 15px; margin-top:0;">📊 DAFTAR KUIS BARU YANG BERJALAN</h3>
     <div id="runningRoomsContainer" style="max-height: 300px; overflow-y: auto;">
        <p style="color: #666; font-size: 13px; text-align: center;">Tidak ada kuis aktif...</p>
     </div>
  </div>

</div>

<!-- LAPORAN SISWA MODAL POPUP -->
<div class="modal-report" id="reportModal">
   <div class="modal-content">
      <h2 style="color: var(--secondary); font-size: 20px; margin:0;" id="reportRoomTitle">ROOM REPORT</h2>
      <hr style="border: 1px solid #333; margin: 15px 0; width: 100%;">
      <div style="flex: 1; overflow-y: auto; margin-bottom: 15px;" id="reportSiswaWrapper"></div>
      <button class="mainBtn" style="background: #444; box-shadow: 0 4px 0 #222;" onclick="tutupLaporanModal()">TUTUP LAPORAN</button>
   </div>
</div>

<script>
  let nomorSoalCounter = 0;
  // Nama folder baru agar tidak menimpa folder 'rooms' bawaan kuis lama Anda
  const FIREBASE_PATH = "kuis_master_baru";

  window.onload = function() {
     const badge = document.getElementById('dbStatusBadge');
     if (firebaseAktif) {
        badge.innerText = "🟢 SERVER TERISOLASI & AMAN";
        badge.style.background = "rgba(76, 175, 80, 0.2)";
        badge.style.color = "var(--green)";
        dengarkanDaftarRoomAktif();
     } else {
        badge.innerText = "⚠️ KONEKSI FIREBASE ERROR";
        badge.style.background = "rgba(244, 67, 54, 0.2)";
        badge.style.color = "var(--red)";
     }
     tambahKolomSoalBaru();
  };

  function showToast(msg) {
    const t = document.getElementById('toast'); 
    t.innerText = msg; t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2500);
  }

  function tambahKolomSoalBaru() {
     nomorSoalCounter++;
     const wrapper = document.getElementById('dynamicSoalWrapper');
     const card = document.createElement('div');
     card.className = 'soal-card-input';
     card.id = `kolomSoal_${nomorSoalCounter}`;
     card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
           <span style="color:var(--secondary); font-weight:bold; font-size:12px;">SOAL NO #${nomorSoalCounter}</span>
           <button style="background:none; border:none; color:var(--red); font-size:12px; cursor:pointer; font-weight:bold;" onclick="hapusKolomSpesifik(${nomorSoalCounter})">Hapus</button>
        </div>
        <input type="text" class="inp-kanji" placeholder="Kanji (Opsional)">
        <input type="text" class="inp-kana" placeholder="Kana / Bacaan (Wajib)">
        <input type="text" class="inp-correct" placeholder="Jawaban Benar (Wajib)" style="border-color: var(--green);">
        <input type="text" class="inp-wrongs" placeholder="3 Pilihan Salah (Pisahkan dengan koma)">
     `;
     wrapper.appendChild(card);
     wrapper.scrollTop = wrapper.scrollHeight;
  }

  function hapusKolomSpesifik(idNomor) {
     const target = document.getElementById(`kolomSoal_${idNomor}`);
     if(target) target.remove();
     reIndexNomorSoal();
  }

  function reIndexNomorSoal() {
     const cards = document.querySelectorAll('.soal-card-input');
     nomorSoalCounter = 0;
     cards.forEach(card => {
        nomorSoalCounter++;
        card.id = `kolomSoal_${nomorSoalCounter}`;
        card.querySelector('span').innerText = `SOAL NO #${nomorSoalCounter}`;
        card.querySelector('button').setAttribute('onclick', `hapusKolomSpesifik(${nomorSoalCounter})`);
     });
  }

  function mulaiKuisDanGenerateLinkBaru() {
     const cards = document.querySelectorAll('.soal-card-input');
     if(cards.length === 0) { showToast("Buat minimal 1 soal!"); return; }
     
     let tempBatch = [];
     let isValid = true;

     cards.forEach((card, idx) => {
        const kana = card.querySelector('.inp-kana').value.trim();
        const correct = card.querySelector('.inp-correct').value.trim();
        if(!kana || !correct) { showToast(`Soal #${idx+1} Belum Lengkap!`); isValid = false; return; }
        
        let choices = [correct];
        const wrongsRaw = card.querySelector('.inp-wrongs').value.trim();
        if(wrongsRaw) wrongsRaw.split(",").forEach(w => { if(w.trim()) choices.push(w.trim()); });
        choices.sort(() => Math.random() - 0.5);

        tempBatch.push({ 
           kanji: card.querySelector('.inp-kanji').value.trim(), 
           kana: kana, 
           correct: correct, 
           options: choices 
        });
     });

     if(!isValid) return;

     const menitAktif = parseInt(document.getElementById('linkExpiryInput').value) || 30;
     const expiredTime = Date.now() + (menitAktif * 60 * 1000);
     const generateNewID = "NEW-" + Math.floor(1000 + Math.random() * 9000);
     
     if (firebaseAktif) {
        // Menyimpan ke jalur folder terisolasi 'kuis_master_baru/'
        database.ref(`${FIREBASE_PATH}/${generateNewID}`).set({
           roomID: generateNewID, expiredAt: expiredTime, questions: tempBatch
        }, () => {
           alert(`Kuis Berhasil Dibuat!\n\nLink Pengerjaan Siswa:\n${window.location.origin + window.location.pathname}?room=${generateNewID}`);
           resetFormInputs();
        });
     } else {
        showToast("Gagal kirim, periksa koneksi Firebase Anda.");
     }
  }

  function resetFormInputs() {
     document.getElementById('dynamicSoalWrapper').innerHTML = "";
     nomorSoalCounter = 0;
     tambahKolomSoalBaru();
  }

  function dengarkanDaftarRoomAktif() {
     if (!firebaseAktif) return;
     // Hanya memantau data di folder 'kuis_master_baru'
     database.ref(FIREBASE_PATH).on('value', snap => {
        const cont = document.getElementById('runningRoomsContainer');
        cont.innerHTML = "";
        if(!snap.exists()) {
           cont.innerHTML = `<p style="color: #666; font-size: 13px; text-align: center;">Tidak ada kuis baru...</p>`;
           return;
        }

        snap.forEach(child => {
           const room = child.val();
           const div = document.createElement('div');
           div.className = 'room-active-item';
           div.innerHTML = `
              <div>
                 <strong style="color:var(--secondary);">${room.roomID}</strong><br>
                 <span style="font-size:11px; color:#aaa;">Soal: ${room.questions ? room.questions.length : 0}</span>
              </div>
              <div style="display:flex; gap:5px;">
                 <button class="mainBtn goldBtn" style="padding:6px 10px; font-size:11px; box-shadow:none; width:auto;" onclick="bukaLaporanNilaiRoom('${room.roomID}')">📊 LAPORAN</button>
                 <button class="mainBtn redBtn" style="padding:6px 10px; font-size:11px; box-shadow:none; width:auto;" onclick="hapusKuisDanDataFirebase('${room.roomID}')">❌ HAPUS</button>
              </div>
           `;
           cont.appendChild(div);
        });
     });
  }

  function hapusKuisDanDataFirebase(idRoom) {
     if(confirm(`Hapus kuis ${idRoom}?`) && firebaseAktif) {
        database.ref(`${FIREBASE_PATH}/${idRoom}`).remove();
     }
  }

  function bukaLaporanNilaiRoom(idRoom) {
     if(!firebaseAktif) return;
     document.getElementById('reportModal').style.display = 'flex';
     document.getElementById('reportRoomTitle').innerText = "📊 LAPORAN ROOM: " + idRoom;
     
     database.ref(`${FIREBASE_PATH}/${idRoom}`).on('value', snap => {
         const wrapper = document.getElementById('reportSiswaWrapper');
         wrapper.innerHTML = "";
         if(!snap.exists() || !snap.val().leaderboard) { 
            wrapper.innerHTML = "<p style='color:#aaa; text-align:center;'>Belum ada data nilai masuk.</p>"; 
            return; 
         }
         
         const dataSiswa = snap.val().leaderboard;
         Object.keys(dataSiswa).forEach(namaUser => {
            const detailUser = dataSiswa[namaUser];
            const div = document.createElement('div');
            div.className = 'report-user-card';
            div.innerHTML = `<strong>👤 ${namaUser}</strong> <span style="float:right; color:var(--gold);">${detailUser.score || 0} Pts</span>`;
            wrapper.appendChild(div);
         });
     });
  }

  function tutupLaporanModal() { document.getElementById('reportModal').style.display = 'none'; }
</script>
</body>
</html>
