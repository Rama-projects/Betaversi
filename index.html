<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>KUIS JFT REALTIME - RAMA</title>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBZSps-natL_AFexEnQl9-chHFiLO0GXes",
    authDomain: "kuis-jepang-29cf5.firebaseapp.com",
    projectId: "kuis-jepang-29cf5",
    storageBucket: "kuis-jepang-29cf5.firebasestorage.app",
    messagingSenderId: "720051856565",
    appId: "1:720051856565:web:6f068222f5d37dd8210afc",
    measurementId: "G-WJMY1D0Q6F",
    databaseURL: "https://kuis-jepang-29cf5-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
  
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
</script>

<style>
  :root { --primary: #ff5722; --secondary: #2196f3; --bg: #121212; --card: #1e1e1e; --text: #eee; --gold: #ffb74d; --green: #4caf50; }
  * { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  input, select, textarea { -webkit-user-select: text; user-select: text; }
  html, body { margin: 0; padding: 0; background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
  body { display: flex; justify-content: center; min-height: 100vh; }
  #app { width: 100vw; max-width: 450px; padding: 20px; display: flex; flex-direction: column; position: relative; }
  
  /* Tombol Garis Tiga (Hamburger Menu) */
  .nav-header { display: flex; justify-content: flex-end; width: 100%; position: absolute; top: 15px; right: 20px; z-index: 100; }
  .burger-btn { background: none; border: none; color: white; font-size: 28px; cursor: pointer; padding: 5px; }
  
  /* Sidebar Menu */
  .sidebar { position: fixed; top: 0; right: -280px; width: 280px; height: 100vh; background: #1a1a1a; box-shadow: -5px 0 15px rgba(0,0,0,0.5); z-index: 1000; transition: 0.3s ease; padding: 30px 20px; display: flex; flex-direction: column; gap: 20px; }
  .sidebar.active { right: 0; }
  .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 999; }
  .sidebar-overlay.active { display: block; }
  .menu-item { background: #252525; padding: 15px; border-radius: 10px; color: white; font-weight: bold; border: 1px solid #333; text-align: left; cursor: pointer; width: 100%; }
  .menu-item:hover { background: var(--primary); }

  .menu-container { display: none; flex-direction: column; gap: 15px; align-items: center; width: 100%; padding-top: 50px; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .mainBtn { background: var(--primary); border-radius: 15px; padding: 15px; font-weight: bold; color: white; width: 100%; border: none; cursor: pointer; font-size: 15px; text-transform: uppercase; box-shadow: 0 5px 0 #bf360c; transition: 0.1s; outline: none; }
  .mainBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #bf360c; }
  .secBtn { background: var(--secondary); box-shadow: 0 5px 0 #1565c0; }
  .goldBtn { background: var(--gold); box-shadow: 0 5px 0 #e65100; color: #000; }
  .greenBtn { background: var(--green); box-shadow: 0 5px 0 #2e7d32; }
  
  input[type="text"], input[type="number"], input[type="password"] { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #444; background: #222; color: white; font-size: 14px; text-align: left; outline: none; }
  
  .admin-box { background: var(--card); border: 1px solid #333; padding: 15px; border-radius: 15px; width: 100%; margin-bottom: 10px; }
  .soal-card-input { background: #252525; border: 1px dashed var(--secondary); padding: 15px; border-radius: 12px; margin-bottom: 15px; position: relative; text-align: left; }
  .soal-item { border-bottom: 1px solid #333; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  
  #displayWord { font-size: 36px; color: var(--text); font-weight: bold; margin-bottom: 10px; text-align: center; }
  #options { display: none; flex-direction: column; gap: 12px; width: 100%; margin-top: 20px; }
  .optBtn { background: #252525; border: 2px solid #333; padding: 16px; border-radius: 12px; color: white; font-size: 16px; cursor: pointer; text-align: left; transition: 0.2s; }
  .optBtn.correct { background: var(--green) !important; border-color: #2e7d32 !important; }
  .optBtn.wrong { background: #f44336 !important; border-color: #c62828 !important; }
  
  #timerDisplay { font-family: monospace; font-size: 24px; color: var(--gold); font-weight: bold; text-align: center; margin-bottom: 10px; }
  #toast { display: none; position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 12px 25px; border-radius: 30px; font-size: 14px; font-weight: bold; z-index: 10000; text-align: center; }
  .lobby-list { background: #1a1a1a; width: 100%; border-radius: 12px; padding: 15px; max-height: 180px; overflow-y: auto; text-align: left; }
</style>
</head>
<body>

<div id="toast"></div>

<!-- HEADER NAVIGASI (GARIS TIGA) -->
<div class="nav-header" id="headerNav">
   <button class="burger-btn" onclick="toggleSidebar(true)">☰</button>
</div>

<!-- OVERLAY & SIDEBAR -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
<div class="sidebar" id="sidebarMenu">
   <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0; color:var(--primary);">MENU UTAMA</h3>
      <button style="background:none; border:none; color:white; font-size:20px; cursor:pointer;" onclick="toggleSidebar(false)">✕</button>
   </div>
   <hr style="border:1px solid #333; width:100%;">
   <button class="menu-item" onclick="aksesModeAdmin()">⚙️ MODE OWNER ADMIN</button>
   <button class="menu-item" onclick="kembaliKeMenuUtamaAsli()">🏠 KEMBALI KE BERANDA</button>
</div>

<div id="app">
  
  <!-- ================= LAYAR LOGIN PESERTA ================= -->
  <div id="loginPage" class="menu-container">
    <h1 style="color: var(--primary); margin-bottom: 5px; text-align:center;">JFT REALTIME</h1>
    <p style="color: #888; font-size: 13px; margin-bottom: 20px; text-align:center;">Silakan masukkan nama Anda untuk bergabung</p>
    <input type="text" id="loginInput" placeholder="NAMA ANDA" autocomplete="off" style="text-align:center; margin-bottom:10px;">
    <button class="mainBtn secBtn" onclick="handleLogin()">MASUK KUIS</button>
  </div>

  <!-- ================= LAYAR PANEL UTAMA ADMIN (INPUT SOAL BERTUMPUK) ================= -->
  <div id="adminMenu" class="menu-container">
    <h2 style="color: var(--gold); margin: 0;">PANEL INPUT SOAL JFT</h2>
    <p style="color: #a8a8a8; margin-top: -10px; font-size: 12px;">Isi kumpulan soal berurutan, lalu klik Mulai Kuis</p>
    
    <div class="admin-box" style="margin-bottom:5px;">
       <label style="font-size:12px; color:#aaa; display:block; margin-bottom:5px;">Waktu Per Soal (Detik):</label>
       <input type="number" id="roomTimerInput" value="20" min="5" style="text-align:center;">
    </div>

    <!-- Wadah Kolom Soal Dinamis Berseri -->
    <div id="dynamicSoalWrapper" style="width:100%; max-height:320px; overflow-y:auto; margin-top:5px; padding-right:5px;"></div>
    
    <button class="mainBtn secBtn" style="padding:10px; font-size:13px;" onclick="tambahKolomSoalBaru()">➕ TAMBAH KOLOM SOAL BARU</button>
    <button class="mainBtn greenBtn" onclick="mulaiKuisDanGenerateLinkBaru()">🚀 MULAI KUIS & SEBAR LINK BARU</button>
  </div>

  <!-- ================= LAYAR LOBBY ROOM / MENUNGGU ================= -->
  <div id="lobbyPage" class="menu-container">
     <h2 style="color: var(--primary); margin:0;" id="lobbyTitle">RUANG TUNGGU</h2>
     <div class="admin-box" style="text-align:center;">
        <span style="font-size:12px; color:#aaa;">LINK KUIS AKTIF ANDA:</span><br>
        <input type="text" id="linkShareUrl" readonly onclick="this.select();" style="font-size:12px; background:#111; color:var(--gold); margin-top:5px; cursor:pointer; text-align:center;">
     </div>
     <h4 style="margin:10px 0 0 0; align-self:flex-start;">Peserta Terhubung (<span id="playerCount">0</span>):</h4>
     <div class="lobby-list" id="lobbyPlayers"></div>
     <div style="color:var(--gold); font-size:14px; text-align:center; margin-top:15px; font-weight:bold; animation: pulse 1.5s infinite;">
        ⏳ Menunggu Soal Pertama Dimulai...
     </div>
  </div>

  <!-- ================= LAYAR UTAMA GAME ARENA KUIS ================= -->
  <div id="wordBox" class="menu-container" style="padding-top:20px;">
    <div id="timerDisplay">00</div>
    <div id="quizInfo" style="font-size:12px; color:var(--secondary); font-weight:bold;">LIVE GAMEPLAY ACTIVE</div>
    <div id="displayWord"></div>
    <div id="options"></div>
  </div>

  <!-- ================= LAYAR LIVE RANKING MULTIPLAYER ================= -->
  <div id="resultPage" class="menu-container">
    <h2 style="margin:0; color:var(--gold);">LIVE RANKING AKHIR</h2>
    <div class="lobby-list" id="liveLeaderboardContent" style="max-height:320px;"></div>
    <button class="mainBtn" style="background:#444; box-shadow:0 5px 0 #222;" onclick="kembaliKeMenuUtamaAsli()">KEMBALI KE BERANDA</button>
  </div>

</div>

<script>
  const ADMIN_SECRET_PASS = "RAMA123"; // Sandi Pengunci Menu Admin

  let username = "";
  let role = "peserta"; 
  let currentRoomID = "";
  let batchSoalKuis = [];
  let roomRef = null;
  let timerInterval = null;
  let canAnswer = false;
  let myScore = 0;
  let nomorSoalCounter = 0;

  window.onload = function() {
     const urlParams = new URLSearchParams(window.location.search);
     const roomParam = urlParams.get('room');
     const statusParam = urlParams.get('status');
     
     if(roomParam) {
        currentRoomID = roomParam;
        document.getElementById('headerNav').style.display = 'none'; // Sembunyikan menu burger di link kuis biar ga diotak-atik
        if(statusParam === 'playing') {
           checkAutoSavedLogin(true);
           return;
        }
        checkAutoSavedLogin(false);
        return;
     }
     
     // Mode Beranda Normal
     document.getElementById('loginPage').style.display = 'flex';
  };

  function toggleSidebar(open) {
     document.getElementById('sidebarMenu').classList.toggle('active', open);
     document.getElementById('sidebarOverlay').classList.toggle('active', open);
  }

  function showToast(msg) {
    const t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block';
    setTimeout(() => { t.style.opacity = '1'; }, 10);
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => { t.style.display = 'none'; }, 400); }, 2500);
  }

  // ================= AKSES PROTOKOL MODE ADMIN VIA SIDEBAR =================
  function aksesModeAdmin() {
     toggleSidebar(false);
     const pass = prompt("Masukkan Kunci Sandi Keamanan Admin:");
     if(pass === null) return;
     if(pass !== ADMIN_SECRET_PASS) { showToast("Sandi Salah! Akses Ditolak."); return; }
     
     role = "admin";
     username = "Admin (Rama)";
     hideSemuaLayar();
     document.getElementById('adminMenu').style.display = 'flex';
     document.getElementById('dynamicSoalWrapper').innerHTML = "";
     nomorSoalCounter = 0;
     tambahKolomSoalBaru();
  }

  function tambahKolomSoalBaru() {
     nomorSoalCounter++;
     const wrapper = document.getElementById('dynamicSoalWrapper');
     const card = document.createElement('div');
     card.className = 'soal-card-input';
     card.id = `kolomSoal_${nomorSoalCounter}`;
     card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
           <span style="color:var(--secondary); font-weight:bold;">SOAL NO #${nomorSoalCounter}</span>
           <button type="button" style="background:none; border:none; color:#ff4444; font-weight:bold; cursor:pointer;" onclick="hapusKolomSpesifik(${nomorSoalCounter})">Hapus</button>
        </div>
        <input type="text" class="inp-kanji" placeholder="Kanji (Opsional)" style="margin-bottom:5px;">
        <input type="text" class="inp-kana" placeholder="Kana / Cara Baca (Wajib)" style="margin-bottom:5px;">
        <input type="text" class="inp-correct" placeholder="Jawaban BENAR (Wajib)" style="margin-bottom:5px; border-color:var(--green);">
        <input type="text" class="inp-wrongs" placeholder="3 Pilihan Salah (Pisah dengan koma)">
     `;
     wrapper.appendChild(card);
     wrapper.scrollTop = wrapper.scrollHeight;
  }

  function hapusKolomSpesifik(idNomor) {
     const target = document.getElementById(`kolomSoal_${idNomor}`);
     if(target) target.remove();
     reIndexNomorSoal();
  }

  function reIndexNomorSoal() {
     const cards = document.querySelectorAll('.soal-card-input');
     nomorSoalCounter = 0;
     cards.forEach(card => {
        nomorSoalCounter++;
        card.id = `kolomSoal_${nomorSoalCounter}`;
        card.querySelector('span').innerText = `SOAL NO #${nomorSoalCounter}`;
        card.querySelector('button').setAttribute('onclick', `hapusKolomSpesifik(${nomorSoalCounter})`);
     });
  }

  // ================= KLIK MULAI KUIS -> GENERATE LINK KUIS BARU =================
  function mulaiKuisDanGenerateLinkBaru() {
     const cards = document.querySelectorAll('.soal-card-input');
     if(cards.length === 0) { showToast("Buat minimal 1 soal dulu!"); return; }
     
     let tempBatch = [];
     let isValid = true;

     cards.forEach((card, idx) => {
        const kanji = card.querySelector('.inp-kanji').value.trim();
        const kana = card.querySelector('.inp-kana').value.trim();
        const correct = card.querySelector('.inp-correct').value.trim();
        const wrongsRaw = card.querySelector('.inp-wrongs').value.trim();

        if(!kana || !correct) {
           showToast(`Soal #${idx+1} Belum Lengkap!`); isValid = false; return;
        }

        let answers = [correct];
        if(wrongsRaw) wrongsRaw.split(",").forEach(w => { if(w.trim()) answers.push(w.trim()); });
        tempBatch.push({ kanji: kanji, kana: kana, correct: correct, answers: answers });
     });

     if(!isValid) return;

     const timerDur = parseInt(document.getElementById('roomTimerInput').value) || 20;
     currentRoomID = "ROOM-" + Math.floor(1000 + Math.random() * 9000);
     
     // Set data room baru ke Firebase
     roomRef = database.ref(`rooms/${currentRoomID}`);
     roomRef.set({
        status: "lobby",
        timerDuration: timerDur,
        currentQuestionIndex: -1,
        questions: tempBatch
     }, () => {
        // BERHASIL GENERATE LINK BARU LANGSUNG KE LOBBY GAMEPLAY
        const linkBaruKuis = window.location.origin + window.location.pathname + "?room=" + currentRoomID;
        hideSemuaLayar();
        document.getElementById('headerNav').style.display = 'none'; // Lock pengaman
        
        // Buka otomatis link kuis baru tersebut di browser Admin agar admin siap mengontrol permainan
        window.location.href = linkBaruKuis;
     });
  }

  // ================= ENGINE LOGIN & SINKRONISASI GAMEPLAY =================
  function checkAutoSavedLogin(isDirectQuiz) {
     let savedUser = localStorage.getItem("jft_live_user");
     if(savedUser) {
        username = savedUser;
        if(isDirectQuiz) { hubungkanKeKuisBerjalan(); } 
        else { joinLobbyRoom(); }
     } else {
        document.getElementById('loginPage').style.display = 'flex';
     }
  }

  function handleLogin() {
     const val = document.getElementById('loginInput').value.trim();
     if(!val) { showToast("Isi Nama Anda!"); return; }
     username = val;
     localStorage.setItem("jft_live_user", username);
     
     if(new URLSearchParams(window.location.search).get('status') === 'playing') {
        hubungkanKeKuisBerjalan();
     } else {
        joinLobbyRoom();
     }
  }

  function joinLobbyRoom() {
     hideSemuaLayar();
     document.getElementById('lobbyPage').style.display = 'flex';
     document.getElementById('lobbyTitle').innerText = "ROOM: " + currentRoomID;
     
     document.getElementById('linkShareUrl').value = window.location.origin + window.location.pathname + "?room=" + currentRoomID;
     
     roomRef = database.ref(`rooms/${currentRoomID}`);
     roomRef.child('players').child(username).set({ score: 0, lastAnswerStatus: "waiting" });
     
     roomRef.child('players').on('value', snap => {
        const pContainer = document.getElementById('lobbyPlayers'); pContainer.innerHTML = "";
        if(snap.exists()) {
           document.getElementById('playerCount').innerText = snap.numChildren();
           snap.forEach(p => {
              let d = document.createElement('div'); d.style.cssText = "padding:6px 0; border-bottom:1px solid #222; font-weight:bold; color:var(--green);";
              d.innerText = "👤 " + p.key; pContainer.appendChild(d);
           });
        }
     });

     // Deteksi jika kuis siap dilempar dari pusat kontrol
     roomRef.child('status').on('value', snap => {
        if(snap.val() === 'playing') {
           window.location.href = window.location.origin + window.location.pathname + "?room=" + currentRoomID + "&status=playing"; 
        }
     });

     // Tombol darurat khusus jika Admin terdeteksi berada di halaman lobby ini untuk trigger soal ke-1
     if(role === 'admin' || localStorage.getItem("jft_live_user") === "Admin (Rama)") {
        let btnMulai = document.createElement('button');
        btnMulai.className = "mainBtn greenBtn"; btnMulai.style.marginTop = "15px";
        btnMulai.innerText = "START PERTANDINGAN 🚀";
        btnMulai.onclick = () => { roomRef.update({ status: "playing", currentQuestionIndex: 0 }); };
        document.getElementById('lobbyPage').appendChild(btnMulai);
     }
  }

  function hubungkanKeKuisBerjalan() {
     hideSemuaLayar();
     document.getElementById('wordBox').style.display = 'flex';
     roomRef = database.ref(`rooms/${currentRoomID}`);
     roomRef.child('players').child(username).update({ score: myScore });

     roomRef.child('currentQuestionIndex').on('value', snap => {
        let idx = snap.val();
        if(idx !== null && idx >= 0) {
           roomRef.child('questions').child(idx).once('value', qSnap => {
              if(qSnap.exists()) renderSoalRealtime(qSnap.val(), idx);
           });
        }
     });

     roomRef.child('status').on('value', snap => {
        if(snap.val() === 'finished') tampilkanLeaderboardAkhir();
     });
  }

  function renderSoalRealtime(qData, index) {
     canAnswer = true;
     document.getElementById('options').style.display = 'flex';
     document.getElementById('options').innerHTML = '';
     
     const display = document.getElementById('displayWord');
     display.innerHTML = (qData.kanji) ? `<ruby>${qData.kanji}<rt>${qData.kana}</rt></ruby>` : qData.kana;
     
     let finalChoices = [...qData.answers].sort(() => Math.random() - 0.5);
     finalChoices.forEach(txt => {
         let b = document.createElement('button'); b.className = 'optBtn'; b.innerText = txt;
         b.onclick = () => verifikasiJawabanRealtime(txt, qData.correct, b);
         document.getElementById('options').appendChild(b);
     });
     
     roomRef.child('timerDuration').once('value', timeSnap => {
         let hitung = timeSnap.val();
         document.getElementById('timerDisplay').innerText = hitung;
         clearInterval(timerInterval);
         
         timerInterval = setInterval(() => {
            hitung--;
            document.getElementById('timerDisplay').innerText = hitung < 10 ? "0" + hitung : hitung;
            if(hitung <= 0) {
               clearInterval(timerInterval);
               kunciJawabanOtomatis(qData.correct);
               
               // Kontrol alur dari pusat Admin
               if(role === 'admin' || localStorage.getItem("jft_live_user") === "Admin (Rama)") {
                  setTimeout(() => {
                     roomRef.child('questions').once('value', allQ => {
                        if(index + 1 < allQ.numChildren()) {
                           roomRef.update({ currentQuestionIndex: index + 1 });
                        } else {
                           roomRef.update({ status: "finished" });
                        }
                     });
                  }, 2500); 
               }
            }
         }, 1000);
     });
  }

  function verifikasiJawabanRealtime(pilihan, jawabanBenar, elemenTombol) {
     if(!canAnswer) return;
     canAnswer = false;
     clearInterval(timerInterval);
     
     if(pilihan === jawabanBenar) {
        elemenTombol.classList.add('correct');
        myScore += 10;
        roomRef.child('players').child(username).update({ score: myScore, lastAnswerStatus: "Benar" });
     } else {
        elemenTombol.classList.add('wrong');
        roomRef.child('players').child(username).update({ lastAnswerStatus: "Salah" });
        Array.from(document.getElementById('options').children).forEach(b => {
           if(b.innerText === jawabanBenar) b.classList.add('correct');
        });
     }
  }

  function kunciJawabanOtomatis(jawabanBenar) {
     if(!canAnswer) return;
     canAnswer = false;
     Array.from(document.getElementById('options').children).forEach(b => {
        if(b.innerText === jawabanBenar) b.classList.add('correct');
     });
  }

  function tampilkanLeaderboardAkhir() {
     clearInterval(timerInterval);
     document.getElementById('wordBox').style.display = 'none';
     document.getElementById('resultPage').style.display = 'flex';
     
     roomRef.child('players').on('value', snap => {
         const lbContent = document.getElementById('liveLeaderboardContent'); lbContent.innerHTML = "";
         let urutanScore = [];
         snap.forEach(player => { urutanScore.push({ name: player.key, ...player.val() }); });
         urutanScore.sort((a,b) => b.score - a.score);
         
         urutanScore.forEach((p, index) => {
            let div = document.createElement('div');
            div.style.cssText = "display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #333; font-size:15px;";
            let medal = index === 0 ? "👑 " : `${index + 1}. `;
            div.innerHTML = `<span><b>${medal}${p.name}</b></span> <span style="color:var(--gold); font-weight:bold;">${p.score} POIN</span>`;
            lbContent.appendChild(div);
         });
     });
  }

  function kembaliKeMenuUtamaAsli() { localStorage.clear(); location.href = window.location.pathname; }
  
  function hideSemuaLayar() {
    ['loginPage','adminMenu','lobbyPage','wordBox','options','resultPage']
    .forEach(id => { document.getElementById(id).style.display = 'none'; });
  }
</script>
</body>
</html>
