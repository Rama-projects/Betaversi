<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nihongo Quest - Gateway</title>
  <style>
    /* ==========================================
       DESAIN KREASI BARU: MODERN & ORIGINAL 
       ========================================== */
    :root {
      --primary-gradient: linear-gradient(135deg, #4f46e5, #7c3aed); /* Deep Indigo & Purple */
      --accent-color: #ff4e88; /* Sakura Pink untuk elemen penting */
      --bg-dark: #0f172a;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      /* Efek dekorasi lingkaran abstrak di background agar estetik */
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 78, 136, 0.1) 0%, transparent 40%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 0;
    }

    .container {
      width: 100%;
      max-width: 380px;
      padding: 15px;
      box-sizing: border-box;
    }

    /* Logo Area Baru - Konsep Gerbang Tori Jepang & Kuis */
    .brand-area {
      text-align: center;
      margin-bottom: 30px;
    }
    .brand-icon {
      width: 70px;
      height: 70px;
      background: var(--primary-gradient);
      color: white;
      border-radius: 20px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3);
      transform: rotate(-5deg); /* Bikin sedikit tilt biar playful */
      transition: transform 0.3s;
    }
    .brand-icon:hover {
      transform: rotate(0deg) scale(1.05);
    }
    .brand-name {
      color: white;
      font-size: 28px;
      font-weight: 800;
      margin: 15px 0 5px 0;
      letter-spacing: -0.5px;
    }
    .brand-tagline {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0;
    }

    /* Form Card Glassmorphism Level Ringan */
    .auth-card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 35px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    .auth-card h2 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: var(--text-main);
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .auth-card .subtitle {
      margin: 0 0 25px 0;
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Input Field Minimalis & Modern */
    .input-wrapper {
      position: relative;
      margin-bottom: 16px;
    }
    .input-wrapper input {
      width: 100%;
      padding: 16px 16px 16px 48px;
      border: 2px solid #f1f5f9;
      border-radius: 16px;
      box-sizing: border-box;
      font-size: 14px;
      background: #f8fafc;
      color: var(--text-main);
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
    }
    .input-wrapper input:focus {
      border-color: #7c3aed;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
    }
    .input-wrapper .field-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: var(--text-muted);
      transition: color 0.2s;
    }
    .input-wrapper input:focus + .field-icon {
      color: #7c3aed;
    }

    /* Tombol Utama Premium */
    .btn-action {
      width: 100%;
      padding: 16px;
      background: var(--primary-gradient);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.25);
      transition: all 0.2s;
    }
    .btn-action:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(124, 58, 237, 0.35);
    }

    /* Pembatas (OR) */
    .or-separator {
      text-align: center;
      margin: 25px 0;
      position: relative;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .or-separator::before, .or-separator::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #e2e8f0;
    }
    .or-separator::before { left: 0; }
    .or-separator::after { right: 0; }

    /* Tombol Google Putih Bersih */
    .btn-google-login {
      width: 100%;
      padding: 14px;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-google-login:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    /* Navigasi Toggle */
    .toggle-view-text {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 25px;
    }
    .toggle-view-text a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 700;
    }
    .toggle-view-text a:hover {
      text-decoration: underline;
    }

    .hidden { display: none !important; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="container">
    <div class="brand-area">
      <div class="brand-icon">⛩️</div>
      <div class="brand-name">Nihongo Quest</div>
      <div class="brand-tagline">Master Japanese Through Play</div>
    </div>

    <div class="auth-card">
      <h2 id="title-state">Welcome Player</h2>
      <p class="subtitle" id="subtitle-state">Log in to sync your quiz progress</p>

      <div id="wrapper-nama" class="input-wrapper hidden">
        <span class="field-icon">👤</span>
        <input type="text" id="input-nama" placeholder="Your Full Name">
      </div>

      <div class="input-wrapper">
        <span class="field-icon">✉️</span>
        <input type="email" id="input-email" placeholder="Email Address">
      </div>

      <div id="wrapper-phone" class="input-wrapper hidden">
        <span class="field-icon">📞</span>
        <input type="tel" id="input-phone" placeholder="Phone Number">
      </div>

      <div class="input-wrapper">
        <span class="field-icon">🔒</span>
        <input type="password" id="input-password" placeholder="Password">
      </div>

      <div id="wrapper-confirm" class="input-wrapper hidden">
        <span class="field-icon">🔄</span>
        <input type="password" id="input-confirm" placeholder="Confirm Password">
      </div>

      <button class="btn-action" id="btn-submit" onclick="eksekusiAuth()">Get Started ➔</button>

      <div class="or-separator">OR CONTiNUE WiTH</div>

      <button class="btn-google-login" onclick="masukGoogle()">
        <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/web-24dp/logo_googleg_color_24dp.png" width="18" alt="Google">
        Google Account
      </button>

      <div class="toggle-view-text" id="toggle-area">
        New to the quest? <a href="#" onclick="pindahMode(true)">Create an Account</a>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    //  KONFIGURASI FIREBASE (TEMPEL PUNYAMU)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyA1234567890-CONTOH-SAJA",
      authDomain: "kuis-jepang-29cf5.firebaseapp.com",
      databaseURL: "https://kuis-jepang-29cf5-default-rtdb.firebaseio.com",
      projectId: "kuis-jepang-29cf5",
      storageBucket: "kuis-jepang-29cf5.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    let registerMode = false;

    // ==========================================
    //  NAVIGASI JS FORM (BEBAS COPYRIGHT JFT)
    // ==========================================
    function pindahMode(keHalamanDaftar) {
      registerMode = keHalamanDaftar;
      const daftarField = ['wrapper-nama', 'wrapper-phone', 'wrapper-confirm'];
      
      if (registerMode) {
        document.getElementById('title-state').innerText = "Join the Quest";
        document.getElementById('subtitle-state').innerText = "Sign up to track scores and win coins";
        document.getElementById('btn-submit').innerText = "Create Account ➕";
        document.getElementById('toggle-area').innerHTML = 'Already a player? <a href="#" onclick="pindahMode(false)">Log In Instead</a>';
        
        daftarField.forEach(id => document.getElementById(id).classList.remove('hidden'));
      } else {
        document.getElementById('title-state').innerText = "Welcome Player";
        document.getElementById('subtitle-state').innerText = "Log in to sync your quiz progress";
        document.getElementById('btn-submit').innerText = "Get Started ➔";
        document.getElementById('toggle-area').innerHTML = 'New to the quest? <a href="#" onclick="pindahMode(true)">Create an Account</a>';
        
        daftarField.forEach(id => document.getElementById(id).classList.add('hidden'));
      }
    }

    // ==========================================
    //  LOGIKA PROSES KE FIREBASE
    // ==========================================
    function eksekusiAuth() {
      const email = document.getElementById('input-email').value;
      const password = document.getElementById('input-password').value;

      if (!email || !password) return alert("Ups! Email & Password harus diisi.");

      if (registerMode) {
        const nama = document.getElementById('input-nama').value;
        const phone = document.getElementById('input-phone').value;
        const confirm = document.getElementById('input-confirm').value;

        if (!nama || !phone) return alert("Nama Lengkap dan Nomor HP jangan dikosongkan ya.");
        if (password !== confirm) return alert("Konfirmasi password kamu salah, tidak cocok.");

        auth.createUserWithEmailAndPassword(email, password)
          .then((res) => {
            // Simpan ke Realtime Database punya kuis kamu
            database.ref('users/' + res.user.uid).set({
              fullName: nama,
              phoneNumber: phone,
              coins: 10, // Kasih modal bonus 10 koin pas daftar!
              playerLevel: "Beginner"
            }).then(() => {
              alert("Akun berhasil dibuat! Selamat bertualang.");
            });
          })
          .catch(err => alert("Gagal Daftar: " + err.message));
      } else {
        auth.signInWithEmailAndPassword(email, password)
          .catch(err => alert("Gagal Masuk: " + err.message));
      }
    }

    function masukGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => alert("Google Error: " + err.message));
    }

    // REDIRECT OTOMATIS KE DASHBOARD WEB JIKA SUKSES
    auth.onAuthStateChanged((user) => {
      if (user) {
        window.location.href = "dashboard.html";
      }
    });
  </script>
</body>
</html>
