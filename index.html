<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JFT KILAT - FINAL PANEL</title>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
  let database = null;
  let firebaseAktif = false;
  const firebaseConfig = {
    apiKey: "AIzaSyBZSps-natL_AFexEnQl9-chHFiLO0GXes",
    authDomain: "kuis-jepang-29cf5.firebaseapp.com",
    projectId: "kuis-jepang-29cf5",
    storageBucket: "kuis-jepang-29cf5.firebasestorage.app",
    messagingSenderId: "720051856565",
    appId: "1:720051856565:web:6f068222f5d37dd8210afc",
    measurementId: "G-WJMY1D0Q6F",
    databaseURL: "https://kuis-jepang-29cf5-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
  
  try {
     if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
     database = firebase.database();
     firebaseAktif = true;
  } catch (error) { console.error("Firebase Error:", error); }
</script>

<style>
  :root { --bg: #121212; --card: #1e1e1e; --text: #eee; --primary: #2196f3; --green: #4caf50; --red: #f44336; --gold: #ffb74d; }
  * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
  .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
  .box { background: var(--card); border: 1px solid #333; padding: 20px; border-radius: 15px; }
  
  input[type="text"], input[type="number"], input[type="file"] { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #444; background: #222; color: white; margin-bottom: 10px; outline: none; }
  
  .btn { background: #ff5722; color: white; border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 #bf360c; width: 100%; display: block; margin-top: 10px; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #bf360c; }
  .secBtn { background: var(--primary); box-shadow: 0 4px 0 #1565c0; }
  .greenBtn { background: var(--green); box-shadow: 0 4px 0 #2e7d32; }
  
  .preview-img-box { width: 100%; max-height: 250px; background: #000; border-radius: 8px; margin-bottom: 10px; display: none; justify-content: center; align-items: center; overflow: hidden; border: 1px solid #444; }
  .preview-img-box img { max-width: 100%; max-height: 250px; object-fit: contain; }
  
  .output-box { display: none; background: #151515; border: 2px solid var(--gold); border-radius: 12px; padding: 15px; margin-top: 10px; }
  .url-text { background: #222; padding: 10px; border-radius: 8px; font-size: 13px; color: var(--gold); word-break: break-all; margin-bottom: 10px; font-family: monospace; }
  .card-soal { background: #252525; padding: 15px; border-radius: 10px; margin-top: 10px; border: 1px dashed var(--primary); }
</style>
</head>
<body>

<div class="container">

  <div id="viewAdmin" class="box">
     <h2 style="color: var(--gold); margin-top: 0; text-align: center;">⚡ JFT KILAT ADMIN</h2>
     <label style="font-size: 12px; color: #aaa;">Masa Aktif Kuis (Menit):</label>
     <input type="number" id="expiryInput" value="180">
     
     <div id="wrapperSoal"></div>
     
     <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn secBtn" type="button" onclick="tambahKolomSoal()">➕ TAMBAH SOAL</button>
        <button class="btn greenBtn" type="button" onclick="simpanDanBikinLink()">🚀 BUAT LINK KUIS</button>
     </div>

     <div class="output-box" id="outputLinkContainer">
        <div style="font-size: 12px; font-weight: bold; margin-bottom: 5px;">🔗 LINK KUIS UNTUK SISWA:</div>
        <div class="url-text" id="textLinkSiswa">Mengecek...</div>
        <button class="btn" style="background:var(--gold); color:#000; box-shadow:0 4px 0 #e65100;" type="button" onclick="salinLinkKuis()">📋 SALIN LINK KUIS</button>
     </div>
  </div>

  <div id="viewKuis" class="box" style="display: none;">
     <div style="display: flex; justify-content: space-between; color: #aaa; font-size: 12px; margin-bottom: 10px;">
        <span id="infoNomer">Soal 1 dari 1</span>
        <span id="infoRoomID">ROOM: -</span>
     </div>

     <div class="preview-img-box" id="wadahGambarSiswa" style="display: flex; min-height: 200px; border: 2px solid #555;">
        <p style="color:#666;">Memuat Gambar...</p>
     </div>

     <p style="font-size: 14px; color: var(--gold); font-weight: bold; text-align: center; margin-bottom: 15px;">
        Lihat gambar di atas, lalu ketik jawabannya di bawah:
     </p>

     <input type="text" id="jawabanSiswaInput" placeholder="Ketik jawaban di sini..." autocomplete="off" style="text-align: center; font-size: 18px;">
     <button class="btn secBtn" type="button" onclick="cekJawabanSiswa()">Kirim Jawaban</button>
     
     <div id="statusJawaban" style="text-align: center; font-size: 20px; font-weight: bold; margin-top: 15px;"></div>
  </div>

</div>

<script>
  let counterSoal = 0;
  let daftarSoalFirebase = [];
  let indexSoalBerjalan = 0;

  window.onload = function() {
     const urlParams = new URLSearchParams(window.location.search);
     const roomParam = urlParams.get('room');
     
     if (roomParam) {
        document.getElementById('viewAdmin').style.display = 'none';
        document.getElementById('viewKuis').style.display = 'block';
        document.getElementById('infoRoomID').innerText = "ROOM: " + roomParam;
        bukaDataKuisSiswa(roomParam);
     } else {
        tambahKolomSoal();
     }
  };

  function tambahKolomSoal() {
     counterSoal++;
     const wadah = document.getElementById('wrapperSoal');
     const card = document.createElement('div');
     card.className = 'card-soal';
     card.id = `panelSoal_${counterSoal}`;
     
     card.innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:12px; font-weight:bold; color:var(--primary);">
           <span>SOAL NO #${counterSoal}</span>
           <span style="color:var(--red); cursor:pointer;" onclick="document.getElementById('panelSoal_${counterSoal}').remove()">Hapus</span>
        </div>
        <div class="preview-img-box" id="pvBox_${counterSoal}"></div>
        
        <input type="text" id="stringBase_${counterSoal}" style="display:none;" value="">
        
        <label style="font-size:11px; color:#aaa;">Upload Gambar Pertanyaan (Wajib):</label>
        <input type="file" accept="image/*" onchange="konversiGambarKeBase64(this, ${counterSoal})">
        
        <label style="font-size:11px; color:#aaa;">Jawaban Benar (Wajib):</label>
        <input type="text" id="jawabanBenar_${counterSoal}" placeholder="Contoh: たな" style="border-color:var(--green);">
     `;
     wadah.appendChild(card);
  }

  function konversiGambarKeBase64(fileInput, idTarget) {
     if (!fileInput.files || !fileInput.files) return;
     const reader = new FileReader();
     reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
           const canvas = document.createElement('canvas');
           let w = img.width; let h = img.height;
           if (w > 500) { h = Math.round((h * 500) / w); w = 500; }
           canvas.width = w; canvas.height = h;
           canvas.getContext('2d').drawImage(img, 0, 0, w, h);
           
           const finalBase64 = canvas.toDataURL('image/jpeg', 0.5);
           document.getElementById(`stringBase_${idTarget}`).value = finalBase64;
           
           const pv = document.getElementById(`pvBox_${idTarget}`);
           pv.innerHTML = `<img src="${finalBase64}">`;
           pv.style.display = 'flex';
        };
        img.src = e.target.result;
     };
     reader.readAsDataURL(fileInput.files);
  }

  function simpanDanBikinLink() {
     const cards = document.querySelectorAll('.card-soal');
     if(cards.length === 0) { alert("Tambah soal dulu!"); return; }
     
     let paketSoal = [];
     let aman = true;

     cards.forEach((card) => {
        const currentId = card.id.split('_');
        const imgData = document.getElementById(`stringBase_${currentId}`).value;
        const jawaban = document.getElementById(`jawabanBenar_${currentId}`).value.trim();

        if(!imgData) { alert(`Gambar di Soal No #${currentId} belum masuk!`); aman = false; return; }
        if(!jawaban) { alert(`Jawaban di Soal No #${currentId} masih kosong!`); aman = false; return; }

        paketSoal.push({ image: imgData, correct: jawaban });
     });

     if(!aman) return;
     if(!firebaseAktif || !database) { alert("Firebase putus koneksi atau belum siap!"); return; }

     const menit = parseInt(document.getElementById('expiryInput').value) || 180;
     const expired = Date.now() + (menit * 60 * 1000);
     const roomID = "JFT-" + Math.floor(1000 + Math.random() * 9000);

     let linkSiswa = window.location.origin + window.location.pathname + "?room=" + roomID;

     // FIX PATH ABSOLUT: Tembak langsung menggunakan path murni string agar tidak crash di Vercel
     database.ref("kuis_master_baru/" + roomID).set({
        roomID: roomID, expiredAt: expired, questions: paketSoal
     }, (err) => {
        if(err) { alert("Gagal Simpan: " + err.message); } else {
           document.getElementById('textLinkSiswa').innerText = linkSiswa;
           document.getElementById('outputLinkContainer').style.display = 'block';
           alert("🚀 LINK KUIS SELESAI DICREATE!");
        }
     });
  }

  function salinLinkKuis() {
     navigator.clipboard.writeText(document.getElementById('textLinkSiswa').innerText);
     alert("Link disalin!");
  }

  // ================= ENGINE HALAMAN KUIS SISWA =================
  function bukaDataKuisSiswa(room) {
     if(!database) {
        setTimeout(() => { bukaDataKuisSiswa(room); }, 1000);
        return;
     }
     database.ref("kuis_master_baru/" + room).once('value').then((snap) => {
        if(!snap.exists()) {
           document.getElementById('viewKuis').innerHTML = `<h2 style="color:var(--red);">KUIS EXPIRED / TIDAK ADA</h2>`;
           return;
        }
        daftarSoalFirebase = snap.val().questions || [];
        tampilkanSoalSiswa();
     }).catch(err => {
        document.getElementById('viewKuis').innerHTML = `<h2 style="color:var(--red);">ERROR SERVER: ${err.message}</h2>`;
     });
  }

  function tampilkanSoalSiswa() {
     if(indexSoalBerjalan >= daftarSoalFirebase.length) {
        document.getElementById('viewKuis').innerHTML = `<h2 style="color:var(--green);">🎉 KUIS SELESAI!</h2><p>Semoga lulus ujian JFT-Basic!</p>`;
        return;
     }

     const soal = daftarSoalFirebase[indexSoalBerjalan];
     document.getElementById('infoNomer').innerText = `Soal ${indexSoalBerjalan + 1} dari ${daftarSoalFirebase.length}`;
     document.getElementById('jawabanSiswaInput').value = "";
     document.getElementById('statusJawaban').innerText = "";

     const wadahGambar = document.getElementById('wadahGambarSiswa');
     wadahGambar.innerHTML = `<img src="${soal.image}" style="max-width:100%; max-height:250px; object-fit:contain;">`;
     wadahGambar.style.display = "flex";
  }

  function cekJawabanSiswa() {
     const input = document.getElementById('jawabanSiswaInput').value.trim().toLowerCase();
     const kunci = daftarSoalFirebase[indexSoalBerjalan].correct.trim().toLowerCase();
     const status = document.getElementById('statusJawaban');

     if(!input) return;

     if (input === kunci) {
        status.innerText = "⭕ BENAR!";
        status.style.color = "var(--green)";
        setTimeout(() => {
           indexSoalBerjalan++;
           tampilkanSoalSiswa();
        }, 1000);
     } else {
        status.innerText = `❌ SALAH! (Kunci: ${daftarSoalFirebase[indexSoalBerjalan].correct})`;
        status.style.color = "var(--red)";
     }
  }
</script>
</body>
</html>
