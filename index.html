<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JFT MASTER PANEL - MANUAL TOTAL</title>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
  let database = null;
  let firebaseAktif = false;

  const firebaseConfig = {
    apiKey: "AIzaSyBZSps-natL_AFexEnQl9-chHFiLO0GXes",
    authDomain: "kuis-jepang-29cf5.firebaseapp.com",
    projectId: "kuis-jepang-29cf5",
    storageBucket: "kuis-jepang-29cf5.firebasestorage.app",
    messagingSenderId: "720051856565",
    appId: "1:720051856565:web:6f068222f5d37dd8210afc",
    measurementId: "G-WJMY1D0Q6F",
    databaseURL: "https://kuis-jepang-29cf5-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
  
  try {
     if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
     }
     database = firebase.database();
     firebaseAktif = true;
  } catch (error) {
     console.error("Gagal terhubung ke Firebase:", error);
  }
</script>

<style>
  :root { --primary: #ff5722; --secondary: #2196f3; --bg: #121212; --card: #1e1e1e; --text: #eee; --gold: #ffb74d; --green: #4caf50; --red: #f44336; }
  * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  html, body { margin: 0; padding: 0; background-color: var(--bg); color: var(--text); }
  body { display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
  #app { width: 100vw; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
  
  .admin-box { background: var(--card); border: 1px solid #333; padding: 20px; border-radius: 15px; }
  .soal-card-input { background: #252525; border: 1px dashed var(--secondary); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
  
  input[type="text"], input[type="number"], input[type="file"] { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #444; background: #222; color: white; font-size: 14px; margin-bottom: 8px; outline: none; }
  
  .img-preview-box { width: 100%; max-height: 150px; background: #111; border-radius: 8px; margin-bottom: 8px; display: none; justify-content: center; align-items: center; overflow: hidden; border: 1px solid #444; }
  .img-preview-box img { max-width: 100%; max-height: 150px; object-fit: contain; }
  
  .mainBtn { position: relative; z-index: 10; background: var(--primary); border-radius: 12px; padding: 14px; font-weight: bold; color: white; width: 100%; border: none; cursor: pointer; font-size: 14px; text-transform: uppercase; box-shadow: 0 4px 0 #bf360c; transition: 0.1s; display: block; }
  .mainBtn:active { transform: translateY(2px); box-shadow: 0 2px 0 #bf360c; }
  .secBtn { background: var(--secondary); box-shadow: 0 4px 0 #1565c0; }
  .greenBtn { background: var(--green); box-shadow: 0 4px 0 #2e7d32; }
  .redBtn { background: var(--red); box-shadow: 0 4px 0 #b71c1c; }
  .goldBtn { background: var(--gold); box-shadow: 0 4px 0 #e65100; color: #000; }

  .link-output-box { display: none; background: #151515; border: 2px solid var(--gold); border-radius: 12px; padding: 15px; margin-top: 15px; }
  .link-text-area { background: #222; border: 1px solid #333; padding: 10px; border-radius: 8px; font-size: 13px; color: var(--gold); word-break: break-all; margin-bottom: 10px; font-family: monospace; max-height: 65px; overflow-y: auto; }

  .room-active-item { background: #252525; border: 1px solid #444; border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .status-db { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: bold; display: inline-block; margin-top: 5px; }
  #toast { display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #ffb74d; color: #000; padding: 12px 25px; border-radius: 25px; z-index: 9999; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
</style>
</head>
<body>

<div id="toast"></div>

<div id="app">
  
  <div style="text-align: center; margin-bottom: 5px;">
     <h1 style="color: var(--gold); margin: 0; font-size: 26px;">JFT MASTER PANEL</h1>
     <div id="dbStatusBadge" class="status-db" style="background: rgba(244, 67, 54, 0.2); color: var(--red);">Menghubungkan Server...</div>
  </div>

  <div class="admin-box">
     <h3 style="color: var(--secondary); font-size: 16px; margin-bottom: 15px; margin-top:0;">🆕 BUAT PAKET KUIS (INPUT MANUAL)</h3>

     <label style="font-size: 12px; color: #aaa; display: block; margin-bottom: 2px;">Masa Aktif Link (Menit):</label>
     <input type="number" id="linkExpiryInput" value="30" min="1">
     
     <div id="dynamicSoalWrapper" style="max-height: 380px; overflow-y: auto; margin-top: 10px; padding-right: 5px;"></div>
     
     <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="mainBtn secBtn" onclick="tambahKolomSoalBaru()">➕ TAMBAH SOAL</button>
        <button class="mainBtn greenBtn" onclick="mulaiKuisDanGenerateLinkBaru()">🚀 MULAI & BUAT LINK</button>
     </div>

     <div class="link-output-box" id="linkOutputContainer">
        <div style="font-size: 12px; font-weight: bold; color: white; margin-bottom: 5px;">🔗 LINK KUIS BERHASIL DIBUAT:</div>
        <div class="link-text-area" id="textLinkSiswa">Mengecek...</div>
        <button class="mainBtn goldBtn" style="padding: 10px;" onclick="salinLinkKeClipboard()">📋 SALIN LINK KUIS</button>
     </div>
  </div>

  <div class="admin-box">
     <h3 style="color: var(--gold); font-size: 16px; margin-bottom: 15px; margin-top:0;">📊 DAFTAR KUIS YANG BERJALAN</h3>
     <div id="runningRoomsContainer" style="max-height: 200px; overflow-y: auto;">
        <p style="color: #666; font-size: 13px; text-align: center;">Tidak ada kuis aktif...</p>
     </div>
  </div>

</div>

<script>
  let nomorSoalCounter = 0;
  const FIREBASE_PATH = "kuis_master_baru";

  window.onload = function() {
     const badge = document.getElementById('dbStatusBadge');
     if (firebaseAktif) {
        badge.innerText = "🟢 SERVER AKTIF & AMAN";
        badge.style.background = "rgba(76, 175, 80, 0.2)";
        badge.style.color = "var(--green)";
        dengarkanDaftarRoomAktif();
     }
     tambahKolomSoalBaru();
  };

  function showToast(msg) {
    const t = document.getElementById('toast'); 
    t.innerText = msg; t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2000);
  }

  function tambahKolomSoalBaru() {
     nomorSoalCounter++;
     const wrapper = document.getElementById('dynamicSoalWrapper');
     const card = document.createElement('div');
     card.className = 'soal-card-input';
     card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
           <span class="nomor-label" style="color:var(--secondary); font-weight:bold; font-size:12px;">SOAL NO #${nomorSoalCounter}</span>
           <button style="background:none; border:none; color:var(--red); font-size:12px; cursor:pointer; font-weight:bold;" onclick="hapusKolomSpesifik(this)">Hapus</button>
        </div>
        
        <div class="img-preview-box"></div>
        <input type="hidden" class="inp-base64" value="">
        
        <label style="font-size:11px; color:#aaa; display:block; margin-bottom:2px;">Tambah Gambar (Opsional):</label>
        <input type="file" accept="image/*" onchange="prosesDanKompresGambar(this)" style="padding:5px; font-size:11px; background:#1a1a1a;">

        <input type="text" class="inp-kanji" placeholder="Kanji / Judul Atas (Opsional)">
        <input type="text" class="inp-kana" placeholder="Pertanyaan / Petunjuk Kuis (Wajib)">
        
        <input type="text" class="inp-correct" placeholder="Jawaban Benar (Wajib)" style="border-color: var(--green);">
        <input type="text" class="inp-wrong1" placeholder="Pilihan Salah 1 (Wajib)" style="border-color: var(--red);">
        <input type="text" class="inp-wrong2" placeholder="Pilihan Salah 2 (Wajib)" style="border-color: var(--red);">
        <input type="text" class="inp-wrong3" placeholder="Pilihan Salah 3 (Wajib)" style="border-color: var(--red);">
     `;
     wrapper.appendChild(card);
     wrapper.scrollTop = wrapper.scrollHeight;
  }

  function prosesDanKompresGambar(inputElement) {
     if (!inputElement.files || !inputElement.files) return;
     const file = inputElement.files; 
     const card = inputElement.closest('.soal-card-input');

     const reader = new FileReader();
     reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
           const canvas = document.createElement('canvas');
           let width = img.width; let height = img.height;
           const MAX_WIDTH = 450;
           if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
           canvas.width = width; canvas.height = height;
           const ctx = canvas.getContext('2d');
           ctx.drawImage(img, 0, 0, width, height);
           const compressedBase64 = canvas.toDataURL('image/jpeg', 0.65);
           
           card.querySelector('.inp-base64').value = compressedBase64;
           const pBox = card.querySelector('.img-preview-box');
           pBox.innerHTML = `<img src="${compressedBase64}">`; 
           pBox.style.display = 'flex';
        };
        img.src = event.target.result;
     };
     reader.readAsDataURL(file);
  }

  function hapusKolomSpesifik(buttonElement) {
     buttonElement.closest('.soal-card-input').remove();
     reIndexNomorSoal();
  }

  function reIndexNomorSoal() {
     const cards = document.querySelectorAll('.soal-card-input');
     nomorSoalCounter = 0;
     cards.forEach(card => {
        nomorSoalCounter++;
        card.querySelector('.nomor-label').innerText = `SOAL NO #${nomorSoalCounter}`;
     });
  }

  function mulaiKuisDanGenerateLinkBaru() {
     const cards = document.querySelectorAll('.soal-card-input');
     if(cards.length === 0) { alert("❌ Buat minimal 1 soal terlebih dahulu!"); return; }
     
     let tempBatch = [];
     let isValid = true;

     cards.forEach((card, index) => {
        const nomorNyata = index + 1;
        
        const kanji = card.querySelector('.inp-kanji').value.trim();
        const kana = card.querySelector('.inp-kana').value.trim();
        const correct = card.querySelector('.inp-correct').value.trim();
        const wrong1 = card.querySelector('.inp-wrong1').value.trim();
        const wrong2 = card.querySelector('.inp-wrong2').value.trim();
        const wrong3 = card.querySelector('.inp-wrong3').value.trim();

        if(!kana) { alert(`❌ Kolom Pertanyaan di Soal No #${nomorNyata} masih kosong.`); isValid = false; return; }
        if(!correct) { alert(`❌ Kolom Jawaban Benar di Soal No #${nomorNyata} masih kosong.`); isValid = false; return; }
        if(!wrong1 || !wrong2 || !wrong3) { alert(`❌ Pilihan Salah 1, 2, dan 3 di Soal No #${nomorNyata} harus diisi.`); isValid = false; return; }
        
        // Gabungkan jawaban benar dan salah, lalu acak posisi tampilnya kuis
        let choices = [correct, wrong1, wrong2, wrong3];
        choices.sort(() => Math.random() - 0.5);

        const base64Image = card.querySelector('.inp-base64').value || "";

        tempBatch.push({ 
           kanji: kanji, 
           kana: kana, 
           correct: correct, 
           options: choices,
           image: base64Image
        });
     });

     if(!isValid) return;
     if (!firebaseAktif) { alert("❌ Gagal terhubung ke Firebase Server! Periksa internet Anda."); return; }

     const menitAktif = parseInt(document.getElementById('linkExpiryInput').value) || 30;
     const expiredTime = Date.now() + (menitAktif * 60 * 1000);
     const generateNewID = "NEW-" + Math.floor(1000 + Math.random() * 9000);
     
     // Buat URL murni tanpa string manipulation yang rawan rusak di server hosting
     let fullURL = window.location.origin + window.location.pathname.replace("index.html", "") + "kuis.html?room=" + generateNewID;

     database.ref(`${FIREBASE_PATH}/${generateNewID}`).set({
        roomID: generateNewID, expiredAt: expiredTime, questions: tempBatch
     }, (error) => {
        if(error) {
           alert("❌ Gagal ke Firebase: " + error.message);
        } else {
           document.getElementById('textLinkSiswa').innerText = fullURL;
           document.getElementById('linkOutputContainer').style.display = 'block';
           showToast("🚀 Kuis Aktif! Silakan salin link di bawah.");
           resetFormInputs();
        }
     });
  }

  function salinLinkKeClipboard() {
     const linkText = document.getElementById('textLinkSiswa').innerText;
     navigator.clipboard.writeText(linkText).then(() => { showToast("📋 LINK BERHASIL DISALIN!"); });
  }

  function resetFormInputs() {
     document.getElementById('dynamicSoalWrapper').innerHTML = "";
     nomorSoalCounter = 0;
     tambahKolomSoalBaru();
  }

  function dengarkanDaftarRoomAktif() {
     if (!firebaseAktif) return;
     database.ref(FIREBASE_PATH).on('value', snap => {
        const cont = document.getElementById('runningRoomsContainer');
        cont.innerHTML = "";
        if(!snap.exists()) { cont.innerHTML = `<p style="text-align: center; color: #666; font-size: 13px;">Tidak ada kuis aktif...</p>`; return; }
        snap.forEach(child => {
           const room = child.val();
           const div = document.createElement('div');
           div.className = 'room-active-item';
           div.innerHTML = `
              <div><strong style="color:var(--secondary);">${room.roomID}</strong><br><span style="font-size:11px; color:#aaa;">Soal: ${room.questions ? room.questions.length : 0}</span></div>
              <button class="mainBtn redBtn" style="padding:6px 10px; font-size:11px; width:auto; box-shadow:none;" onclick="hapusKuisDanDataFirebase('${room.roomID}')">❌ HAPUS</button>
           `;
           cont.appendChild(div);
        });
     });
  }

  function hapusKuisDanDataFirebase(idRoom) {
     if(confirm(`Hapus kuis ${idRoom}?`) && firebaseAktif) { database.ref(`${FIREBASE_PATH}/${idRoom}`).remove(); }
  }
</script>
</body>
</html>
