<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JFT MASTER PANEL - FIX LIVE</title>

<script src="data_minna.js"></script>
<script src="data_irodori.js"></script>
<script src="data_ssw_pm.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
  let database = null;
  let firebaseAktif = false;

  const firebaseConfig = {
    apiKey: "AIzaSyBZSps-natL_AFexEnQl9-chHFiLO0GXes",
    authDomain: "kuis-jepang-29cf5.firebaseapp.com",
    projectId: "kuis-jepang-29cf5",
    storageBucket: "kuis-jepang-29cf5.firebasestorage.app",
    messagingSenderId: "720051856565",
    appId: "1:720051856565:web:6f068222f5d37dd8210afc",
    measurementId: "G-WJMY1D0Q6F",
    databaseURL: "https://kuis-jepang-29cf5-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
  
  try {
     if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
     }
     database = firebase.database();
     firebaseAktif = true;
  } catch (error) {
     console.error("Firebase Error:", error);
  }
</script>

<style>
  :root { --primary: #ff5722; --secondary: #2196f3; --bg: #121212; --card: #1e1e1e; --text: #eee; --gold: #ffb74d; --green: #4caf50; --red: #f44336; }
  * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { margin: 0; padding: 20px; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
  #app { width: 100vw; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
  .admin-box { background: var(--card); border: 1px solid #333; padding: 20px; border-radius: 15px; }
  .soal-card-input { background: #252525; border: 1px dashed var(--secondary); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
  input[type="text"], input[type="number"], input[type="file"] { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #444; background: #222; color: white; font-size: 14px; margin-bottom: 8px; outline: none; }
  .img-preview-box { width: 100%; max-height: 150px; background: #111; border-radius: 8px; margin-bottom: 8px; display: none; justify-content: center; align-items: center; overflow: hidden; border: 1px solid #444; }
  .img-preview-box img { max-width: 100%; max-height: 150px; object-fit: contain; }
  .mainBtn { background: var(--primary); border-radius: 12px; padding: 14px; font-weight: bold; color: white; width: 100%; border: none; cursor: pointer; font-size: 14px; text-transform: uppercase; box-shadow: 0 4px 0 #bf360c; display: block; }
  .mainBtn:active { transform: translateY(2px); box-shadow: 0 2px 0 #bf360c; }
  .secBtn { background: var(--secondary); box-shadow: 0 4px 0 #1565c0; }
  .greenBtn { background: var(--green); box-shadow: 0 4px 0 #2e7d32; }
  .redBtn { background: var(--red); box-shadow: 0 4px 0 #b71c1c; }
  .goldBtn { background: var(--gold); box-shadow: 0 4px 0 #e65100; color: #000; }
  .link-output-box { display: none; background: #151515; border: 2px solid var(--gold); border-radius: 12px; padding: 15px; margin-top: 15px; }
  .link-text-area { background: #222; border: 1px solid #333; padding: 10px; border-radius: 8px; font-size: 13px; color: var(--gold); word-break: break-all; margin-bottom: 10px; font-family: monospace; max-height: 65px; overflow-y: auto; }
  .room-active-item { background: #252525; border: 1px solid #444; border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .status-db { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: bold; display: inline-block; margin-top: 5px; }
</style>
</head>
<body>

<div id="app">
  <div style="text-align: center;">
     <h1 style="color: var(--gold); margin: 0; font-size: 26px;">JFT MASTER PANEL</h1>
     <div id="dbStatusBadge" class="status-db" style="background: rgba(244, 67, 54, 0.2); color: var(--red);">Menghubungkan Server...</div>
  </div>

  <div class="admin-box">
     <h3 style="color: var(--secondary); font-size: 16px; margin: 0 0 15px 0;">🆕 BUAT PAKET KUIS</h3>

     <label style="font-size: 12px; color: #aaa; display: block; margin-bottom: 2px;">Masa Aktif Link (Menit):</label>
     <input type="number" id="linkExpiryInput" value="120" min="1">
     
     <div id="dynamicSoalWrapper" style="max-height: 380px; overflow-y: auto; margin-top: 10px;"></div>
     
     <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="mainBtn secBtn" onclick="tambahKolomSoalBaru()">➕ TAMBAH SOAL</button>
        <button class="mainBtn greenBtn" onclick="mulaiKuisDanGenerateLinkBaru()">🚀 MULAI & BUAT LINK</button>
     </div>

     <div class="link-output-box" id="linkOutputContainer">
        <div style="font-size: 12px; font-weight: bold; color: white; margin-bottom: 5px;">🔗 LINK KUIS UNTUK SISWA:</div>
        <div class="link-text-area" id="textLinkSiswa">Mengecek...</div>
        <button class="mainBtn goldBtn" style="padding: 10px;" onclick="salinLinkKeClipboard()">📋 SALIN LINK KUIS</button>
     </div>
  </div>

  <div class="admin-box">
     <h3 style="color: var(--gold); font-size: 16px; margin: 0 0 15px 0;">📊 DAFTAR KUIS YANG BERJALAN</h3>
     <div id="runningRoomsContainer" style="max-height: 200px; overflow-y: auto;">
        <p style="color: #666; font-size: 13px; text-align: center;">Tidak ada kuis aktif...</p>
     </div>
  </div>
</div>

<script>
  let nomorSoalCounter = 0;
  const FIREBASE_PATH = "kuis_master_baru";

  window.onload = function() {
     if (firebaseAktif) {
        const badge = document.getElementById('dbStatusBadge');
        badge.innerText = "🟢 SERVER AKTIF & AMAN";
        badge.style.background = "rgba(76, 175, 80, 0.2)";
        badge.style.color = "var(--green)";
        dengarkanDaftarRoomAktif();
     }
     tambahKolomSoalBaru();
  };

  function tambahKolomSoalBaru() {
     nomorSoalCounter++;
     const wrapper = document.getElementById('dynamicSoalWrapper');
     const card = document.createElement('div');
     card.className = 'soal-card-input';
     card.id = `soalCard_${nomorSoalCounter}`;
     card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
           <span class="nomor-label" style="color:var(--secondary); font-weight:bold; font-size:12px;">SOAL NO #${nomorSoalCounter}</span>
           <button style="background:none; border:none; color:var(--red); font-size:12px; cursor:pointer; font-weight:bold;" onclick="hapusKolomSpesifik('${card.id}')">Hapus</button>
        </div>
        
        <div class="img-preview-box" id="preview_${nomorSoalCounter}"></div>
        <input type="hidden" id="baseData_${nomorSoalCounter}" class="inp-base64" value="">
        
        <label style="font-size:11px; color:#aaa; display:block; margin-bottom:2px;">Tambah Gambar (Wajib/Opsional):</label>
        <input type="file" accept="image/*" onchange="prosesGambar('${nomorSoalCounter}', this)" style="padding:5px; font-size:11px; background:#1a1a1a;">

        <input type="text" class="inp-kanji" placeholder="Kanji / Judul Atas (Opsional)">
        <input type="text" class="inp-kana" placeholder="Pertanyaan / Petunjuk Kuis (Wajib)">
        <input type="text" class="inp-correct" placeholder="Jawaban Benar (Wajib)" style="border-color: var(--green);">
     `;
     wrapper.appendChild(card);
     wrapper.scrollTop = wrapper.scrollHeight;
  }

  function prosesGambar(idIndex, inputElement) {
     if (!inputElement.files || !inputElement.files) return;
     const file = inputElement.files; 

     const reader = new FileReader();
     reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
           const canvas = document.createElement('canvas');
           let width = img.width; let height = img.height;
           if (width > 450) { height = Math.round((height * 450) / width); width = 450; }
           canvas.width = width; canvas.height = height;
           const ctx = canvas.getContext('2d');
           ctx.drawImage(img, 0, 0, width, height);
           
           const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
           document.getElementById(`baseData_${idIndex}`).value = compressedBase64;
           
           const pBox = document.getElementById(`preview_${idIndex}`);
           pBox.innerHTML = `<img src="${compressedBase64}">`; 
           pBox.style.display = 'flex';
        };
        img.src = event.target.result;
     };
     reader.readAsDataURL(file);
  }

  function hapusKolomSpesifik(cardId) {
     const el = document.getElementById(cardId);
     if(el) el.remove();
     reIndexNomorSoal();
  }

  function reIndexNomorSoal() {
     const cards = document.querySelectorAll('.soal-card-input');
     nomorSoalCounter = 0;
     cards.forEach(card => {
        nomorSoalCounter++;
        card.querySelector('.nomor-label').innerText = `SOAL NO #${nomorSoalCounter}`;
     });
  }

  function gabungDanAcakGocekan(jawabanBenar) {
     let wadahData = [];
     try {
        if (typeof irodori !== "undefined") wadahData = wadahData.concat(irodori);
        if (typeof data_irodori !== "undefined") wadahData = wadahData.concat(data_irodori);
        if (typeof minna !== "undefined") wadahData = wadahData.concat(minna);
        if (typeof data_minna !== "undefined") wadahData = wadahData.concat(data_minna);
        if (typeof ssw !== "undefined") wadahData = wadahData.concat(ssw);
        if (typeof data_ssw_pm !== "undefined") wadahData = wadahData.concat(data_ssw_pm);
     } catch (e) { console.log(e); }

     let kataMentah = [];
     if(wadahData.length > 0) {
        kataMentah = wadahData.map(i => i ? (i.kana || i.correct || (typeof i === 'string' ? i : "")) : "").filter(Boolean);
     }
     if (kataMentah.length < 5) {
        kataMentah = ["たべます", "のみます", "いきます", "きます", "みます", "かいます", "へや", "いえ"];
     }

     let hasilFilter = kataMentah.filter(k => k !== jawabanBenar);
     hasilFilter = [...new Set(hasilFilter)];
     hasilFilter.sort(() => Math.random() - 0.5);
     return hasilFilter.slice(0, 3);
  }

  function mulaiKuisDanGenerateLinkBaru() {
     const cards = document.querySelectorAll('.soal-card-input');
     if(cards.length === 0) { alert("Buat minimal 1 soal!"); return; }
     
     let tempBatch = [];
     let isValid = true;

     cards.forEach((card) => {
        const kanji = card.querySelector('.inp-kanji').value.trim();
        const kana = card.querySelector('.inp-kana').value.trim();
        const correct = card.querySelector('.inp-correct').value.trim();
        const base64Image = card.querySelector('.inp-base64').value || "";

        if(!kana || !correct) { alert("Pertanyaan dan Jawaban Benar wajib diisi!"); isValid = false; return; }
        
        let wrongs = gabungDanAcakGocekan(correct);
        let choices = [correct, ...wrongs];
        choices.sort(() => Math.random() - 0.5);

        tempBatch.push({ 
           kanji: kanji, kana: kana, correct: correct, options: choices, image: base64Image
        });
     });

     if(!isValid || !firebaseAktif) return;

     const menit = parseInt(document.getElementById('linkExpiryInput').value) || 120;
     const expiredTime = Date.now() + (menit * 60 * 1000);
     const roomID = "ROOM-" + Math.floor(1000 + Math.random() * 9000);
     
     // PERBAIKAN UTAMA: Mengunci rute URL agar langsung mengarah ke halaman kuis di domain yang sama!
     let cleanPath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
     let fullURL = window.location.origin + cleanPath + "kuis.html?room=" + roomID;

     database.ref(`${FIREBASE_PATH}/${roomID}`).set({
        roomID: roomID, expiredAt: expiredTime, questions: tempBatch
     }, (error) => {
        if(!error) {
           document.getElementById('textLinkSiswa').innerText = fullURL;
           document.getElementById('linkOutputContainer').style.display = 'block';
           alert("🚀 Sukses! Link kuis telah dibuat di bawah.");
        } else {
           alert("Gagal simpan ke Firebase!");
        }
     });
  }

  function salinLinkKeClipboard() {
     const txt = document.getElementById('textLinkSiswa').innerText;
     navigator.clipboard.writeText(txt).then(() => { alert("📋 Link berhasil disalin!"); });
  }

  function dengarkanDaftarRoomAktif() {
     database.ref(FIREBASE_PATH).on('value', snap => {
        const cont = document.getElementById('runningRoomsContainer');
        cont.innerHTML = "";
        if(!snap.exists()) { cont.innerHTML = `<p style="text-align: center; color: #666; font-size: 13px;">Tidak ada kuis aktif...</p>`; return; }
        snap.forEach(child => {
           const room = child.val();
           const div = document.createElement('div');
           div.className = 'room-active-item';
           div.innerHTML = `
              <div><strong style="color:var(--secondary);">${room.roomID}</strong><br><span style="font-size:11px; color:#aaa;">Soal: ${room.questions ? room.questions.length : 0}</span></div>
              <button class="mainBtn redBtn" style="padding:6px 10px; font-size:11px; width:auto; box-shadow:none;" onclick="hapusRoom('${room.roomID}')">❌ HAPUS</button>
           `;
           cont.appendChild(div);
        });
     });
  }

  function hapusRoom(id) {
     if(confirm(`Hapus kuis ${id}?`)) database.ref(`${FIREBASE_PATH}/${id}`).remove();
  }
</script>
</body>
</html>
