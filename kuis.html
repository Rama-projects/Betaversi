<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JFT KILAT - KUIS SISWA</title>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<style>
  :root { --bg: #121212; --card: #1e1e1e; --text: #eee; --primary: #2196f3; --green: #4caf50; --red: #f44336; --gold: #ffb74d; }
  * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { margin: 0; padding: 15px; background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
  .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .box { background: var(--card); border: 1px solid #333; padding: 20px; border-radius: 15px; width: 100%; text-align: center; }
  .soal-img { width: 100%; max-height: 250px; object-fit: contain; background: #000; border-radius: 10px; margin-bottom: 15px; border: 1px solid #444; }
  .teks-jepang { font-size: 22px; font-weight: bold; color: var(--gold); margin-bottom: 5px; }
  .teks-kana { font-size: 16px; color: #aaa; margin-bottom: 20px; }
  .grid-jawaban { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 15px; }
  .btn-opsi { background: #2a2a2a; color: white; border: 2px solid #444; padding: 14px; width: 100%; border-radius: 12px; font-size: 15px; cursor: pointer; text-align: left; transition: 0.2s; -webkit-tap-highlight-color: transparent; }
  .benar { background: var(--green) !important; border-color: #2e7d32 !important; color: white; font-weight: bold; }
  .salah { background: var(--red) !important; border-color: #c62828 !important; color: white; }
  .info-header { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #333; }
</style>
</head>
<body>

<div class="container">
  <div class="box" id="kontenKuis">
     <h3 style="color:var(--primary);">⏳ Memuat Ujian...</h3>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBZSps-natL_AFexEnQl9-chHFiLO0GXes",
    authDomain: "kuis-jepang-29cf5.firebaseapp.com",
    projectId: "kuis-jepang-29cf5",
    storageBucket: "kuis-jepang-29cf5.appspot.com",
    messagingSenderId: "720051856565",
    appId: "1:720051856565:web:6f068222f5d37dd8210afc",
    measurementId: "G-WJMY1D0Q6F",
    databaseURL: "https://kuis-jepang-29cf5-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
  
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  const urlParams = new URLSearchParams(window.location.search);
  const roomID = urlParams.get('room');

  let daftarSoal = [];
  let indeksSoalSekarang = 0;
  let skorBenar = 0;

  if (!roomID) {
     document.getElementById('kontenKuis').innerHTML = `<h3 style="color:var(--red);">❌ LINK ERROR</h3>`;
  } else {
     AmbilDataKuisDariFirebase();
  }

  function AmbilDataKuisDariFirebase() {
     database.ref("kuis_master_baru/" + roomID).once("value").then((snapshot) => {
        const data = snapshot.val();
        if (!data) {
           document.getElementById('kontenKuis').innerHTML = `<h3 style="color:var(--red);">❌ KUIS TIDAK ADA</h3>`;
           return;
        }
        if (Date.now() > data.expiredAt) {
           document.getElementById('kontenKuis').innerHTML = `<h3 style="color:var(--red);">⏱️ WAKTU KUIS HABIS</h3>`;
           return;
        }
        daftarSoal = data.questions;
        TampilkanSoalNomor(indeksSoalSekarang);
     }).catch((err) => {
        document.getElementById('kontenKuis').innerHTML = `Error: ${err.message}`;
     });
  }

  function TampilkanSoalNomor(index) {
     if (index >= daftarSoal.length) {
        TampilkanHalamanSkorAkhir();
        return;
     }

     const dataSoal = daftarSoal[index];
     const wadah = document.getElementById('kontenKuis');

     let opsiJawaban = [...dataSoal.answers];
     opsiJawaban.sort(() => 0.5 - Math.random());

     let htmlOpsi = "";
     opsiJawaban.forEach((opsi) => {
        htmlOpsi += `<button class="btn-opsi" onclick="cekJawabanSiswa(this, '${opsi.replace(/'/g, "\\'")}', '${dataSoal.correct.replace(/'/g, "\\'")}')">${opsi}</button>`;
     });

     wadah.innerHTML = `
        <div class="info-header">
           <span>ROOM: <b>${roomID}</b></span>
           <span>SOAL: <b>${index + 1} / ${daftarSoal.length}</b></span>
        </div>
        <img class="soal-img" src="${dataSoal.image}">
        <div class="teks-jepang">${dataSoal.kanji || ''}</div>
        <div class="teks-kana">${dataSoal.kana || ''}</div>
        <div class="grid-jawaban">${htmlOpsi}</div>
     `;
  }

  function cekJawabanSiswa(tombolDiklik, jawabanDipilih, jawabanBenar) {
     const semuaTombol = document.querySelectorAll('.btn-opsi');
     semuaTombol.forEach(btn => btn.disabled = true);

     if (jawabanDipilih.toLowerCase() === jawabanBenar.toLowerCase()) {
        tombolDiklik.classList.add('benar');
        skorBenar++;
     } else {
        tombolDiklik.classList.add('salah');
        semuaTombol.forEach((btn) => {
           if (btn.innerText.toLowerCase() === jawabanBenar.toLowerCase()) {
              btn.classList.add('benar');
           }
        });
     }

     setTimeout(() => {
        indeksSoalSekarang++;
        TampilkanSoalNomor(indeksSoalSekarang);
     }, 1500);
  }

  function TampilkanHalamanSkorAkhir() {
     const wadah = document.getElementById('kontenKuis');
     const totalSoal = daftarSoal.length;
     const nilaiAkhir = Math.round((skorBenar / totalSoal) * 100);

     wadah.innerHTML = `
        <h2 style="color:var(--gold); margin-top:0;">🎉 SELESAI!</h2>
        <div style="background:#252525; padding:20px; border-radius:12px; margin:20px 0; border:1px dashed #444;">
           <div style="font-size:14px; color:#aaa;">BENAR</div>
           <div style="font-size:32px; font-weight:bold; color:var(--green);">${skorBenar} / ${totalSoal}</div>
           <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
           <div style="font-size:14px; color:#aaa;">NILAI</div>
           <div style="font-size:54px; font-weight:bold; color:var(--primary);">${nilaiAkhir}</div>
        </div>
        <button class="btn-opsi" style="text-align:center; background:var(--primary); border:none;" onclick="location.reload()">🔄 ULANGI</button>
     `;
  }
</script>
</body>
</html>
