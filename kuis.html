<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KUIS JFT KILAT - LIVE SOAL</title>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<style>
  :root { --bg: #121212; --card: #1e1e1e; --text: #eee; --primary: #2196f3; --green: #4caf50; --red: #f44336; --gold: #ffb74d; }
  * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
  #kuisContainer { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
  .box { background: var(--card); border: 1px solid #333; padding: 20px; border-radius: 15px; text-align: center; }
  
  /* UKURAN GAMBAR SOAL DIASSURANSIKAN MUNCUL BESAR & JELAS */
  .wadah-gambar-soal { width: 100%; min-height: 200px; max-height: 350px; background: #000; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 2px solid #444; }
  .wadah-gambar-soal img { max-width: 100%; max-height: 350px; object-fit: contain; display: block; }
  
  input[type="text"] { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #555; background: #222; color: white; font-size: 16px; text-align: center; outline: none; margin-bottom: 15px; }
  input[type="text"]:focus { border-color: var(--primary); }
  
  .btn { background: var(--primary); color: white; border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 #1565c0; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #1565c0; }
  
  .status-text { font-size: 18px; font-weight: bold; margin-top: 10px; }
</style>
</head>
<body>

<div id="kuisContainer">
  <div class="box" id="loadingBox">
     <h2 style="color:var(--gold);">Memuat Soal JFT...</h2>
     <p>Tunggu sebentar, sedang mengambil data gambar dari server.</p>
  </div>

  <div class="box" id="mainKuisBox" style="display: none;">
     <div style="display: flex; justify-content: space-between; color: #aaa; font-size: 13px; margin-bottom: 10px;">
        <span id="infoNoSoal">Soal 1 dari 1</span>
        <span id="infoRoom">ROOM: -</span>
     </div>

     <div class="wadah-gambar-soal" id="tempatGambar">
        <p style="color:#666;">Gambar tidak ditemukan</p>
     </div>

     <p style="font-size: 14px; color: var(--gold); font-weight: bold; margin-bottom: 15px;">
        Lihat gambar di atas, lalu ketik jawabannya di bawah:
     </p>

     <input type="text" id="inputJawabanSiswa" placeholder="Ketik jawaban di sini..." autocomplete="off">
     <button class="btn" onclick="periksaJawabanSiswa()">Kirim Jawaban</button>
     
     <div id="feedbackHasil" class="status-text"></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBZSps-natL_AFexEnQl9-chHFiLO0GXes",
    authDomain: "kuis-jepang-29cf5.firebaseapp.com",
    projectId: "kuis-jepang-29cf5",
    storageBucket: "kuis-jepang-29cf5.firebasestorage.app",
    messagingSenderId: "720051856565",
    appId: "1:720051856565:web:6f068222f5d37dd8210afc",
    measurementId: "G-WJMY1D0Q6F",
    databaseURL: "https://kuis-jepang-29cf5-default-rtdb.asia-southeast1.firebasedatabase.app"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  let listSoal = [];
  let indexSekarang = 0;

  // Ambil parameter ?room=ROOM-XXXX dari URL
  const urlParams = new URLSearchParams(window.location.search);
  const roomID = urlParams.get('room');

  window.onload = function() {
     if(!roomID) {
        document.getElementById('loadingBox').innerHTML = `<h2 style="color:var(--red);">KUIS ERROR</h2><p>Link tidak sah atau ID Room hilang.</p>`;
        return;
     }
     document.getElementById('infoRoom').innerText = "ROOM: " + roomID;
     ambilDataKuisDariFirebase();
  };

  function ambilDataKuisDariFirebase() {
     database.ref(`kuis_master_baru/${roomID}`).once('value').then((snap) => {
        if(!snap.exists()) {
           document.getElementById('loadingBox').innerHTML = `<h2 style="color:var(--red);">KUIS KADALUARSA</h2><p>Kuis tidak ditemukan atau sudah dihapus.</p>`;
           return;
        }
        
        const data = snap.val();
        listSoal = data.questions || [];
        
        if(listSoal.length === 0) {
           document.getElementById('loadingBox').innerHTML = `<h2 style="color:var(--red);">KUIS KOSONG</h2><p>Tidak ada soal di dalam kuis ini.</p>`;
           return;
        }

        document.getElementById('loadingBox').style.display = 'none';
        document.getElementById('mainKuisBox').style.display = 'block';
        tampilkanSoalAktif();
     }).catch(err => {
        document.getElementById('loadingBox').innerHTML = `<h2 style="color:var(--red);">GAGAL KONEKSI</h2><p>${err.message}</p>`;
     });
  }

  function tampilkanSoalAktif() {
     if(indexSekarang >= listSoal.length) {
        // Kuis Selesai
        document.getElementById('mainKuisBox').innerHTML = `
           <h2 style="color:var(--green);">🎉 KUIS SELESAI!</h2>
           <p style="font-size:16px;">Semua soal gambar berhasil lu selesaikan.</p>
           <button class="btn" style="background:var(--gold); color:#000; box-shadow:0 4px 0 #e65100;" onclick="location.reload()">Ulangi Kuis</button>
        `;
        return;
     }

     const soal = listSoal[indexSekarang];
     document.getElementById('infoNoSoal').innerText = `Soal ${indexSekarang + 1} dari ${listSoal.length}`;
     document.getElementById('inputJawabanSiswa').value = "";
     document.getElementById('feedbackHasil').innerText = "";

     // FIX ABADI: Membuka paksa string gambar base64 ke tag img HTML
     const tempatGambar = document.getElementById('tempatGambar');
     if(soal.image && soal.image.startsWith("data:image")) {
        tempatGambar.innerHTML = `<img src="${soal.image}" alt="Soal Gambar JFT">`;
     } else {
        tempatGambar.innerHTML = `<p style="color:var(--red); font-weight:bold; padding:20px;">Gagal memuat gambar kuis!<br><span style="font-size:11px;color:#666;">Data base64 rusak/tidak terkirim dari admin.</span></p>`;
     }
  }

  function periksaJawabanSiswa() {
     const jawabanSiswa = document.getElementById('inputJawabanSiswa').value.trim().toLowerCase();
     const jawabanBenar = listSoal[indexSekarang].correct.trim().toLowerCase();
     const feedback = document.getElementById('feedbackHasil');

     if(!jawabanSiswa) { alert("Ketik dulu jawaban lu, bro!"); return; }

     if(jawabanSiswa === jawabanBenar) {
        feedback.innerText = "⭕ BENAR!";
        feedback.style.color = "var(--green)";
        setTimeout(() => {
           indexSekarang++;
           tampilkanSoalAktif();
        }, 1200);
     } else {
        feedback.innerText = `❌ SALAH! (Jawaban: ${listSoal[indexSekarang].correct})`;
        feedback.style.color = "var(--red)";
     }
  }
</script>
</body>
</html>
